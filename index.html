<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello World - Virat Kohli</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #283cff, transparent 30%),
                radial-gradient(circle at 80% 80%, #00eaff, transparent 25%),
                #050816;

            color: white;
        }

        .card {
            width: 650px;
            min-height: 520px;

            padding: 55px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 30px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0;

            font-size: 65px;

            background: linear-gradient(
                90deg,
                #00eaff,
                white,
                #8b5cf6
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: glow 2s infinite alternate;
        }

        .subtitle {
            margin: 20px 0 35px;

            color: #b8c0d9;

            font-size: 17px;

            letter-spacing: 3px;
        }

        button {
            padding: 16px 38px;

            border: none;

            border-radius: 50px;

            background: linear-gradient(
                90deg,
                #00c6ff,
                #7c3aed
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 25px #00c6ff,
                0 0 50px #7c3aed;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            cursor: default;
        }

        #virat {
            display: none;

            margin-top: 30px;

            animation: reveal 1.2s ease forwards;
        }

        #virat img {
            width: 220px;
            height: 235px;

            object-fit: cover;

            border-radius: 25px;

            border: 3px solid white;

            box-shadow:
                0 0 25px #00eaff,
                0 0 60px rgba(0, 234, 255, 0.4);
        }

        #virat h2 {
            margin: 15px 0 5px;

            font-size: 30px;
        }

        #virat p {
            margin: 0;

            color: #00eaff;

            letter-spacing: 4px;

            font-size: 14px;

            font-weight: bold;
        }

        @keyframes reveal {

            0% {
                opacity: 0;
                transform: scale(0.3) translateY(80px);
            }

            60% {
                transform: scale(1.1) translateY(-10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes glow {

            from {
                filter: drop-shadow(0 0 5px #00eaff);
            }

            to {
                filter: drop-shadow(0 0 25px #8b5cf6);
            }
        }

    </style>

</head>


<body>

    <div class="card">

        <h1>Hello, World! 🌎</h1>

        <div class="subtitle">
            SOMETHING SPECIAL IS WAITING...
        </div>

        <button id="enterButton">
            ENTER THE WORLD 🚀
        </button>


        <div id="virat">

            <img
                src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Virat%20Kohli%20portrait.jpg"
                alt="Virat Kohli"
            >

            <h2>👑 Virat Kohli</h2>

            <p>THE KING</p>

        </div>

    </div>


    <script>

        const button = document.getElementById("enterButton");

        const virat = document.getElementById("virat");


        button.addEventListener("click", function() {

            virat.style.display = "block";

            button.innerHTML = "🔥 KING REVEALED";

            button.disabled = true;

        });

    </script>

</body>

</html>
