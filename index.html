<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghumi Ghumi</title>

<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a;font-family:Arial;color:white}
canvas{display:block}

#ui{
 position:fixed;top:12px;left:12px;right:12px;z-index:20;
 display:flex;justify-content:space-between;pointer-events:none
}
.panel{
 background:rgba(0,0,0,.8);padding:10px 15px;border-radius:13px;
 border:1px solid #333;box-shadow:0 5px 25px #000
}
.bar{width:240px;height:16px;background:#350505;border-radius:20px;overflow:hidden;margin-top:5px}
#heroHP{width:100%;height:100%;background:#22c55e}

#bossUI{
 position:fixed;top:70px;left:50%;transform:translateX(-50%);
 width:430px;z-index:20;display:none;text-align:center
}
#bossName{font-size:22px;color:#ff2222;font-weight:bold;text-shadow:0 0 20px red}
#bossHP{height:20px;background:#300;border-radius:20px;overflow:hidden}
#bossHPFill{height:100%;width:100%;background:#e11}

#objective{
 position:fixed;top:105px;left:50%;transform:translateX(-50%);
 z-index:20;background:rgba(0,0,0,.65);padding:7px 18px;border-radius:20px
}

#message{
 position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
 z-index:70;display:none;text-align:center;font-size:42px;font-weight:bold;
 text-shadow:0 0 20px red
}

#retry{
 position:fixed;top:58%;left:50%;transform:translateX(-50%);
 z-index:71;display:none;padding:14px 45px;border:0;border-radius:30px;
 background:#b91c1c;color:white;font-size:18px;font-weight:bold
}

#startScreen{
 position:fixed;inset:0;z-index:100;display:flex;
 align-items:center;justify-content:center;
 background:radial-gradient(circle,#390817,#050208 70%)
}
.startBox{text-align:center;padding:45px;border:1px solid #522;border-radius:25px;background:#ffffff08}
.startBox h1{font-size:58px;margin:0;color:#ff2929;text-shadow:0 0 20px red,0 0 50px red}
.startBtn{margin-top:20px;padding:14px 42px;border:0;border-radius:30px;background:#b91c1c;color:white;font-size:18px;font-weight:bold}

#controls{
 position:fixed;bottom:10px;left:10px;z-index:20;
 background:#000b;padding:9px 13px;border-radius:10px;font-size:13px
}
</style>
</head>

<body>

<div id="startScreen">
 <div class="startBox">
  <h1>🌀 GHUMI GHUMI 🌀</h1>
  <h2>DARK BATTLE</h2>
  <p>10 Levels • Different Enemies • Powerful Bosses</p>
  <p>⚔️ Sword &nbsp; 🌀 T Spin &nbsp; 🔱 K Ultra</p>
  <button class="startBtn" onclick="startGame()">START BATTLE</button>
 </div>
</div>

<div id="ui">
 <div class="panel">
  ❤️ HERO HP
  <div class="bar"><div id="heroHP"></div></div>
 </div>

 <div class="panel">
  LEVEL <b id="levelText">1</b>/10 |
  SCORE <b id="scoreText">0</b><br>
  ⚡ <span id="powerText">READY</span>
 </div>
</div>

<div id="objective">DARK FOREST</div>

<div id="bossUI">
 <div id="bossName">BOSS</div>
 <div id="bossHP"><div id="bossHPFill"></div></div>
</div>

<div id="message"></div>

<button id="retry" onclick="retryGame()">🔄 RETRY</button>

<div id="controls">
 <b>W A S D</b> Move |
 <b>SPACE / CLICK</b> Sword |
 <b>T</b> GHUMI |
 <b>K</b> 🔱 ULTRA
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
canvas.width=W;canvas.height=H;

addEventListener("resize",()=>{
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
});

let running=false;
let level=1;
let score=0;
let levelTime=0;
let spawnTimer=0;

let enemies=[];
let bullets=[];
let particles=[];
let boss=null;

let keys={};
let lastTime=0;

let swordActive=false;

/* =========================
   T SPIN STATE
========================= */

let spinning=false;
let spinTime=0;
let spinAngle=0;
let spinHeight=0;

/* =========================
   K ULTRA
========================= */

let ultraMode=false;
let trishulActive=false;
let trishulTime=0;
let trishulProgress=0;

let damageMultiplier=1;
let speedMultiplier=1;


/* =========================
   HERO
========================= */

const hero={
 x:W/2,
 y:H/2,
 r:25,
 speed:5,
 hp:100,
 maxHp:100
};


/* =========================
   ENEMIES
========================= */

const types={
 beast:{hp:60,speed:2,damage:8,r:23,color:"#991b1b"},
 hunter:{hp:90,speed:3,damage:10,r:21,color:"#6320a0"},
 demon:{hp:150,speed:2.5,damage:14,r:28,color:"#7f1111"},
 brute:{hp:330,speed:1.2,damage:20,r:38,color:"#444"},
 shadow:{hp:190,speed:3.5,damage:17,r:26,color:"#111827"},
 monster:{hp:420,speed:1.6,damage:24,r:43,color:"#641786"},
 bomber:{hp:110,speed:2.7,damage:30,r:24,color:"#b45309"},
 vampire:{hp:180,speed:2.4,damage:16,r:27,color:"#9f1239"}
};

const pools=[
 ["beast","hunter"],
 ["beast","hunter","bomber"],
 ["hunter","demon","brute"],
 ["demon","brute","bomber"],
 ["shadow","vampire"],
 ["hunter","demon","brute"],
 ["shadow","hunter","bomber"],
 ["demon","brute","vampire"],
 ["shadow","monster","brute","bomber"],
 ["monster","brute","vampire"]
];

const levelNames=[
 "🌑 DARK FOREST",
 "🏃 ENEMY RUSH",
 "🏰 DEMON CASTLE",
 "🌋 LAVA ARENA",
 "👻 SHADOW WORLD",
 "⚡ LIGHTNING TEMPLE",
 "🌀 PORTAL WORLD",
 "💀 BOSS HUNT",
 "🔥 ENDLESS ARMY",
 "👑 DARK GOD"
];

const bossNames=[
 "BLOOD REAPER",
 "DARK HUNTER",
 "SKULL LORD",
 "HELL BRUTE",
 "DEMON KING",
 "NIGHTMARE",
 "VOID WARRIOR",
 "DARK TITAN",
 "HELL EMPEROR",
 "THE DARK GOD"
];

const bossHP=[
 1800,2500,3400,4500,5700,
 7000,9000,11500,14500,20000
];


/* =========================
   INPUT
========================= */

addEventListener("keydown",e=>{

 const k=e.key.toLowerCase();

 keys[k]=true;

 if(k==="t"){
   e.preventDefault();
   activateSpin();
 }

 if(k==="k"){
   e.preventDefault();
   activateUltra();
 }

 if(e.code==="Space"){
   e.preventDefault();
   swordAttack();
 }
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousedown",swordAttack);


/* =========================
   START
========================= */

function startGame(){

 document.getElementById("startScreen").style.display="none";

 resetGame();

 running=true;

 startLevel();

 lastTime=performance.now();

 requestAnimationFrame(loop);
}

function resetGame(){

 level=1;
 score=0;
 levelTime=0;
 spawnTimer=0;

 enemies=[];
 bullets=[];
 particles=[];
 boss=null;

 spinning=false;
 spinTime=0;
 spinAngle=0;

 ultraMode=false;
 trishulActive=false;
 trishulTime=0;

 damageMultiplier=1;
 speedMultiplier=1;

 hero.x=W/2;
 hero.y=H/2;
 hero.hp=100;

 document.getElementById("retry").style.display="none";
 document.getElementById("message").style.display="none";
}


/* =========================
   LEVEL
========================= */

function startLevel(){

 enemies=[];
 bullets=[];
 boss=null;

 levelTime=0;
 spawnTimer=0;

 document.getElementById("levelText").innerText=level;
 document.getElementById("objective").innerText=levelNames[level-1];

 document.getElementById("bossUI").style.display="none";

 showMessage(levelNames[level-1]);
}


/* =========================
   SPAWN
========================= */

function spawnEnemy(){

 const pool=pools[level-1];
 const type=pool[Math.floor(Math.random()*pool.length)];
 const d=types[type];

 const side=Math.floor(Math.random()*4);

 let x,y;

 if(side===0){x=-70;y=Math.random()*H}
 else if(side===1){x=W+70;y=Math.random()*H}
 else if(side===2){x=Math.random()*W;y=-70}
 else{x=Math.random()*W;y=H+70}

 const diff=1+(level-1)*.16;

 enemies.push({
  type,
  x,y,
  r:d.r,
  hp:d.hp*diff,
  maxHp:d.hp*diff,
  speed:d.speed*(1+(level-1)*.05),
  damage:d.damage*diff,
  color:d.color,
  flash:0,
  bomb:0
 });
}


/* =========================
   BOSS
========================= */

function spawnBoss(){

 if(boss)return;

 boss={
  name:bossNames[level-1],
  x:W/2,
  y:130,
  r:72+level*3,
  hp:bossHP[level-1],
  maxHp:bossHP[level-1],
  speed:.8+level*.035,
  damage:25+level*4,
  attack:0,
  phase:1,
  flash:0
 };

 document.getElementById("bossName").innerText=
  "☠ "+boss.name+" ☠";

 document.getElementById("bossUI").style.display="block";

 updateBossBar();

 showMessage("☠ "+boss.name+" ☠");
}


/* =========================
   MOVEMENT
========================= */

function moveHero(){

 let dx=0,dy=0;

 if(keys.w)dy--;
 if(keys.s)dy++;
 if(keys.a)dx--;
 if(keys.d)dx++;

 if(dx||dy){

  const l=Math.hypot(dx,dy);

  hero.x+=dx/l*hero.speed*speedMultiplier;
  hero.y+=dy/l*hero.speed*speedMultiplier;
 }

 hero.x=Math.max(hero.r,Math.min(W-hero.r,hero.x));
 hero.y=Math.max(95,Math.min(H-hero.r,hero.y));
}

function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}


/* =========================
   SWORD
========================= */

function swordAttack(){

 if(!running||ultraMode)return;

 swordActive=true;

 setTimeout(()=>swordActive=false,130);

 const damage=45*damageMultiplier;

 for(let i=enemies.length-1;i>=0;i--){

  const e=enemies[i];

  if(dist(hero,e)<125){

   e.hp-=damage;
   e.flash=5;

   hit(e.x,e.y);

   if(e.hp<=0){

    score+=100;
    explosion(e.x,e.y);
    enemies.splice(i,1);
   }
  }
 }

 if(boss&&dist(hero,boss)<155){

  boss.hp-=damage;
  boss.flash=5;

  updateBossBar();

  if(boss.hp<=0)defeatBoss();
 }
}


/* =========================================================
   T = GHUMI GHUMI

   CHARACTER ITSELF ROTATES.
   NO SECOND GAME LOOP.
========================================================= */

function activateSpin(){

 if(!running)return;
 if(spinning)return;
 if(trishulActive)return;

 spinning=true;

 spinTime=1.7;

 spinAngle=0;

 spinHeight=0;

 document.getElementById("powerText").innerText=
  "🌀 GHUMI GHUMI";
}


/* =========================
   SPIN UPDATE
========================= */

function updateSpin(dt){

 if(!spinning)return;

 spinTime-=dt;

 spinAngle+=dt*14;

 /*
    Floating movement.
    Hero actually rises and falls.
 */

 const progress=
   1-(spinTime/1.7);

 spinHeight=
   Math.sin(progress*Math.PI)*55;

 /*
    Spin damage.
 */

 const range=155;

 for(let i=enemies.length-1;i>=0;i--){

  const e=enemies[i];

  if(dist(hero,e)<range){

   e.hp-=5*damageMultiplier;

   e.flash=2;

   /*
      Knock enemy backward.
   */

   const dx=e.x-hero.x;
   const dy=e.y-hero.y;
   const d=Math.max(1,Math.hypot(dx,dy));

   e.x+=dx/d*7;
   e.y+=dy/d*7;

   if(e.hp<=0){

    score+=100;

    explosion(e.x,e.y);

    enemies.splice(i,1);
   }
  }
 }

 /*
    Boss gets spin damage too.
 */

 if(boss&&dist(hero,boss)<range){

  boss.hp-=5*damageMultiplier;
  boss.flash=3;

  updateBossBar();

  if(boss.hp<=0){

   defeatBoss();

   spinning=false;

   return;
  }
 }

 if(spinTime<=0){

  spinning=false;
  spinTime=0;
  spinHeight=0;

  document.getElementById("powerText").innerText=
   "READY";
 }
}


/* =========================================================
   K = ULTRA REVERSE TRISHUL
========================================================= */

function activateUltra(){

 if(!running)return;
 if(trishulActive)return;

 ultraMode=true;
 trishulActive=true;

 spinning=false;

 trishulTime=1.35;
 trishulProgress=0;

 bullets=[];

 document.getElementById("powerText").innerText=
  "🔱 ULTRA TRISHUL";

 /*
    NORMAL ENEMIES 100% DEAD
 */

 for(const e of enemies){

  score+=100;

  explosion(e.x,e.y);
 }

 enemies=[];

 /*
    BOSS 60% MAX HP
 */

 if(boss){

  boss.hp-=boss.maxHp*.60;

  boss.flash=10;

  explosion(boss.x,boss.y);

  updateBossBar();

  if(boss.hp<=0)
   defeatBoss();
 }
}


/* =========================
   ULTRA UPDATE
========================= */

function updateUltra(dt){

 if(!trishulActive)return;

 trishulTime-=dt;

 trishulProgress=
  Math.min(1,1-trishulTime/1.35);

 /*
    Keep all attacks away.
 */

 bullets=[];

 if(trishulTime<=0){

  trishulTime=0;

  trishulActive=false;

  ultraMode=false;

  document.getElementById("powerText").innerText=
   "READY";
 }
}


/* =========================
   ENEMIES
========================= */

function updateEnemies(dt){

 /*
    K = COMPLETE INVINCIBILITY
 */

 if(ultraMode)return;

 for(let i=enemies.length-1;i>=0;i--){

  const e=enemies[i];

  const dx=hero.x-e.x;
  const dy=hero.y-e.y;

  const d=Math.max(1,Math.hypot(dx,dy));

  e.x+=dx/d*e.speed;
  e.y+=dy/d*e.speed;

  if(e.type==="bomber"){

   e.bomb+=dt;

   if(d<85&&e.bomb>1.2){

    explosion(e.x,e.y);

    hero.hp-=e.damage;

    enemies.splice(i,1);

    continue;
   }
  }

  if(d<hero.r+e.r*.65){

   hero.hp-=e.damage*dt*.06;
  }

  if(e.flash>0)e.flash--;
 }
}


/* =========================
   BOSS UPDATE
========================= */

function updateBoss(dt){

 if(!boss)return;

 if(ultraMode)return;

 const p=boss.hp/boss.maxHp;

 if(p<=.66)boss.phase=2;
 if(p<=.33)boss.phase=3;

 const dx=hero.x-boss.x;
 const dy=hero.y-boss.y;

 const d=Math.max(1,Math.hypot(dx,dy));

 let speed=boss.speed;

 if(boss.phase===2)speed*=1.3;
 if(boss.phase===3)speed*=1.6;

 if(d>125){

  boss.x+=dx/d*speed;
  boss.y+=dy/d*speed;
 }

 if(d<hero.r+boss.r*.55){

  hero.hp-=boss.damage*dt*.035;
 }

 boss.attack+=dt;

 const attackRate=
  boss.phase===3?.7:
  boss.phase===2?1:1.3;

 if(boss.attack>=attackRate){

  boss.attack=0;

  const angle=
   Math.atan2(hero.y-boss.y,hero.x-boss.x);

  const count=
   boss.phase===3?7:
   boss.phase===2?5:3;

  for(let i=0;i<count;i++){

   const a=
    angle+(i-(count-1)/2)*.18;

   bullets.push({
    x:boss.x,
    y:boss.y,
    vx:Math.cos(a)*5,
    vy:Math.sin(a)*5,
    life:4,
    damage:10+level*2
   });
  }
 }

 if(boss.flash>0)boss.flash--;
}


/* =========================
   BULLETS
========================= */

function updateBullets(dt){

 if(ultraMode){

  bullets=[];

  return;
 }

 for(let i=bullets.length-1;i>=0;i--){

  const b=bullets[i];

  b.x+=b.vx;
  b.y+=b.vy;

  b.life-=dt;

  if(Math.hypot(hero.x-b.x,hero.y-b.y)<30){

   hero.hp-=b.damage;

   hit(hero.x,hero.y);

   bullets.splice(i,1);

   continue;
  }

  if(b.life<=0)
   bullets.splice(i,1);
 }
}


/* =========================
   LEVEL SYSTEM
========================= */

function updateLevel(dt){

 levelTime+=dt;
 spawnTimer+=dt;

 let rate=.8;

 if(level===2)rate=.35;
 if(level===4)rate=.55;
 if(level===9)rate=.22;

 if(spawnTimer>=rate&&!boss){

  spawnTimer=0;

  let count=1;

  if(level>=3)count=2;
  if(level>=7)count=3;
  if(level===9)count=4;

  for(let i=0;i<count;i++)
   spawnEnemy();
 }

 let bossTime=
  level===9?45:
  level===10?8:
  25;

 if(levelTime>=bossTime&&!boss){

  enemies=[];

  spawnBoss();
 }
}


/* =========================
   BOSS DEFEAT
========================= */

function defeatBoss(){

 if(!boss)return;

 explosion(boss.x,boss.y);

 score+=5000;

 boss=null;

 bullets=[];

 document.getElementById("bossUI").style.display="none";

 if(level>=10){

  victory();

  return;
 }

 showMessage("👑 BOSS DEFEATED");

 setTimeout(()=>{

  if(running){

   level++;

   startLevel();
  }

 },1200);
}


/* =========================
   PARTICLES
========================= */

function hit(x,y){

 for(let i=0;i<6;i++){

  particles.push({
   x,y,
   vx:(Math.random()-.5)*7,
   vy:(Math.random()-.5)*7,
   life:.4,
   size:3+Math.random()*3
  });
 }
}

function explosion(x,y){

 for(let i=0;i<28;i++){

  particles.push({
   x,y,
   vx:(Math.random()-.5)*14,
   vy:(Math.random()-.5)*14,
   life:.7,
   size:3+Math.random()*6
  });
 }
}

function updateParticles(dt){

 for(const p of particles){

  p.x+=p.vx;
  p.y+=p.vy;

  p.vx*=.96;
  p.vy*=.96;

  p.life-=dt;
 }

 particles=particles.filter(p=>p.life>0);
}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

 let top="#17061e";
 let bottom="#040208";

 if(level===4){
  top="#401000";
  bottom="#0d0200";
 }

 if(level===6){
  top="#071b3c";
  bottom="#02040c";
 }

 if(level===7){
  top="#19062f";
  bottom="#04010a";
 }

 if(level===10){
  top="#30030b";
  bottom="#050106";
 }

 const g=ctx.createLinearGradient(0,0,0,H);

 g.addColorStop(0,top);
 g.addColorStop(1,bottom);

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 /*
    Stars
 */

 ctx.fillStyle="rgba(255,255,255,.45)";

 for(let i=0;i<100;i++){

  const x=(i*173)%W;

  const y=
   (i*97+performance.now()*.025)%H;

  ctx.fillRect(x,y,2,2);
 }

 /*
    Arena rings
 */

 ctx.save();

 ctx.translate(W/2,H/2);

 ctx.strokeStyle="rgba(255,255,255,.045)";

 for(let i=1;i<7;i++){

  ctx.beginPath();

  ctx.arc(0,0,i*100,0,Math.PI*2);

  ctx.stroke();
 }

 ctx.restore();

 ctx.strokeStyle="rgba(255,40,40,.14)";
 ctx.lineWidth=3;

 ctx.strokeRect(15,75,W-30,H-90);
}


/* =========================================================
   HERO DRAW

   THIS IS THE IMPORTANT PART:
   BODY ITSELF ROTATES DURING T.
========================================================= */

function drawHero(){

 /*
    Hero rises during spin.
 */

 const drawY=
  hero.y-
  spinHeight;

 ctx.save();

 ctx.translate(hero.x,drawY);

 /*
    During spin rotate the whole body.
 */

 if(spinning){

  ctx.rotate(spinAngle);

  /*
     Bright spinning aura.
  */

  ctx.beginPath();

  ctx.arc(
   0,
   0,
   65+Math.sin(performance.now()/50)*10,
   0,
   Math.PI*2
  );

  ctx.strokeStyle="#ffd000";
  ctx.lineWidth=6;

  ctx.shadowBlur=30;
  ctx.shadowColor="#ffd000";

  ctx.stroke();

  ctx.shadowBlur=0;
 }


 /*
    Cape
 */

 ctx.fillStyle="#991b1b";

 ctx.beginPath();

 ctx.moveTo(-15,5);
 ctx.lineTo(-55,55);
 ctx.lineTo(0,35);
 ctx.lineTo(55,55);
 ctx.lineTo(15,5);

 ctx.closePath();

 ctx.fill();


 /*
    Legs
 */

 ctx.strokeStyle="#111";
 ctx.lineWidth=11;

 ctx.beginPath();

 ctx.moveTo(-9,25);
 ctx.lineTo(-14,55);

 ctx.moveTo(9,25);
 ctx.lineTo(14,55);

 ctx.stroke();


 /*
    Body
 */

 ctx.fillStyle="#dc2626";

 ctx.beginPath();

 ctx.roundRect(
  -21,-10,42,43,10
 );

 ctx.fill();


 /*
    Arms
 */

 ctx.strokeStyle="#f0b090";
 ctx.lineWidth=10;

 ctx.beginPath();

 ctx.moveTo(-18,-2);
 ctx.lineTo(-40,18);

 ctx.moveTo(18,-2);
 ctx.lineTo(40,18);

 ctx.stroke();


 /*
    Head
 */

 ctx.fillStyle="#f0b090";

 ctx.beginPath();

 ctx.arc(0,-29,18,0,Math.PI*2);

 ctx.fill();


 /*
    Hair
 */

 ctx.fillStyle="#111";

 ctx.beginPath();

 ctx.arc(
  0,-36,18,
  Math.PI,
  Math.PI*2
 );

 ctx.fill();


 /*
    Eyes
 */

 ctx.fillStyle="#111";

 ctx.beginPath();

 ctx.arc(-6,-29,3,0,Math.PI*2);
 ctx.arc(6,-29,3,0,Math.PI*2);

 ctx.fill();


 /*
    Chest
 */

 ctx.fillStyle="#ffd000";

 ctx.beginPath();

 ctx.moveTo(0,-5);
 ctx.lineTo(8,8);
 ctx.lineTo(0,4);
 ctx.lineTo(-8,8);

 ctx.closePath();

 ctx.fill();


 /*
    Sword
 */

 if(swordActive){

  ctx.fillStyle="#fff";

  ctx.shadowBlur=15;
  ctx.shadowColor="#fff";

  ctx.fillRect(25,-5,100,9);

  ctx.shadowBlur=0;

  ctx.fillStyle="#ffd000";

  ctx.fillRect(20,-9,10,18);
 }

 ctx.restore();


 /*
    Extra circular energy trails
    around the flying hero.
 */

 if(spinning){

  ctx.save();

  ctx.translate(hero.x,drawY);

  for(let i=0;i<3;i++){

   ctx.rotate(
    spinAngle*(i+1)*.35
   );

   ctx.beginPath();

   ctx.ellipse(
    0,
    0,
    80+i*18,
    24+i*8,
    0,
    0,
    Math.PI*2
   );

   ctx.strokeStyle=
    i===0
    ?"rgba(255,215,0,.8)"
    :"rgba(255,180,0,.3)";

   ctx.lineWidth=4;

   ctx.shadowBlur=15;
   ctx.shadowColor="#ffd000";

   ctx.stroke();
  }

  ctx.restore();
 }
}


/* =========================
   TRISHUL DRAW
========================= */

function drawTrishul(){

 if(!trishulActive)return;

 const p=trishulProgress;

 const distance=30+p*430;

 const angle=-Math.PI/2+p*Math.PI*2;

 const x=hero.x+Math.cos(angle)*distance;

 const y=hero.y-spinHeight+Math.sin(angle)*distance;

 const scale=.35+p;

 ctx.save();

 ctx.translate(x,y);

 ctx.rotate(
  -Math.PI/2+p*Math.PI*2
 );

 ctx.strokeStyle="#ffd700";
 ctx.fillStyle="#ffd700";
 ctx.lineWidth=8;

 ctx.shadowBlur=35;
 ctx.shadowColor="#ffd700";

 /*
    Handle
 */

 ctx.beginPath();

 ctx.moveTo(0,110*scale);
 ctx.lineTo(0,-50*scale);

 ctx.stroke();

 /*
    Center
 */

 ctx.beginPath();

 ctx.moveTo(0,-45*scale);
 ctx.lineTo(0,-155*scale);

 ctx.stroke();

 /*
    Left
 */

 ctx.beginPath();

 ctx.moveTo(0,-50*scale);
 ctx.lineTo(-50*scale,-105*scale);
 ctx.lineTo(-50*scale,-50*scale);

 ctx.stroke();

 /*
    Right
 */

 ctx.beginPath();

 ctx.moveTo(0,-50*scale);
 ctx.lineTo(50*scale,-105*scale);
 ctx.lineTo(50*scale,-50*scale);

 ctx.stroke();

 ctx.restore();

 /*
    Energy beam
 */

 ctx.save();

 ctx.strokeStyle="rgba(255,215,0,.25)";
 ctx.lineWidth=20;

 ctx.beginPath();

 ctx.moveTo(hero.x,hero.y-spinHeight);
 ctx.lineTo(x,y);

 ctx.stroke();

 ctx.restore();
}


/* =========================
   ENEMY DRAW
========================= */

function drawEnemy(e){

 ctx.save();

 ctx.translate(e.x,e.y);

 ctx.fillStyle=
  e.flash>0?"white":e.color;

 ctx.beginPath();

 ctx.roundRect(
  -e.r*.6,
  -e.r*.1,
  e.r*1.2,
  e.r*1.1,
  8
 );

 ctx.fill();

 ctx.fillStyle="#62382d";

 ctx.beginPath();

 ctx.arc(
  0,
  -e.r*.55,
  e.r*.48,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.fillStyle="#ddd";

 ctx.beginPath();

 ctx.moveTo(-e.r*.2,-e.r*.75);
 ctx.lineTo(-e.r*.6,-e.r*1.3);
 ctx.lineTo(-e.r*.05,-e.r*.9);
 ctx.fill();

 ctx.beginPath();

 ctx.moveTo(e.r*.2,-e.r*.75);
 ctx.lineTo(e.r*.6,-e.r*1.3);
 ctx.lineTo(e.r*.05,-e.r*.9);
 ctx.fill();

 ctx.fillStyle="#f00";

 ctx.shadowBlur=15;
 ctx.shadowColor="red";

 ctx.beginPath();

 ctx.arc(-e.r*.17,-e.r*.55,4,0,Math.PI*2);
 ctx.arc(e.r*.17,-e.r*.55,4,0,Math.PI*2);

 ctx.fill();

 ctx.shadowBlur=0;

 ctx.fillStyle="#250000";

 ctx.fillRect(
  -e.r,
  e.r*1.2,
  e.r*2,
  5
 );

 ctx.fillStyle="#22c55e";

 ctx.fillRect(
  -e.r,
  e.r*1.2,
  e.r*2*Math.max(0,e.hp/e.maxHp),
  5
 );

 ctx.restore();
}


/* =========================
   BOSS DRAW
========================= */

function drawBoss(){

 if(!boss)return;

 ctx.save();

 ctx.translate(boss.x,boss.y);

 ctx.strokeStyle=
  boss.phase===3?"orange":"red";

 ctx.lineWidth=10;

 ctx.shadowBlur=40;

 ctx.shadowColor=
  boss.phase===3?"orange":"red";

 ctx.beginPath();

 ctx.arc(
  0,
  0,
  boss.r*1.3+
  Math.sin(performance.now()/130)*8,
  0,
  Math.PI*2
 );

 ctx.stroke();

 ctx.shadowBlur=0;

 ctx.fillStyle=
  boss.flash>0?"white":"#250000";

 ctx.beginPath();

 ctx.roundRect(
  -boss.r*.65,
  -boss.r*.05,
  boss.r*1.3,
  boss.r*1.2,
  15
 );

 ctx.fill();

 ctx.fillStyle="#593126";

 ctx.beginPath();

 ctx.arc(
  0,
  -boss.r*.65,
  boss.r*.5,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.fillStyle="#ddd";

 ctx.beginPath();

 ctx.moveTo(-boss.r*.3,-boss.r*.85);
 ctx.lineTo(-boss.r*.75,-boss.r*1.5);
 ctx.lineTo(-boss.r*.05,-boss.r);
 ctx.fill();

 ctx.beginPath();

 ctx.moveTo(boss.r*.3,-boss.r*.85);
 ctx.lineTo(boss.r*.75,-boss.r*1.5);
 ctx.lineTo(boss.r*.05,-boss.r);
 ctx.fill();

 ctx.fillStyle="#f00";

 ctx.shadowBlur=25;
 ctx.shadowColor="red";

 ctx.beginPath();

 ctx.arc(-boss.r*.2,-boss.r*.65,7,0,Math.PI*2);
 ctx.arc(boss.r*.2,-boss.r*.65,7,0,Math.PI*2);

 ctx.fill();

 ctx.restore();
}


/* =========================
   BULLETS
========================= */

function drawBullets(){

 for(const b of bullets){

  ctx.fillStyle="#ff2222";

  ctx.shadowBlur=18;
  ctx.shadowColor="red";

  ctx.beginPath();

  ctx.arc(b.x,b.y,7,0,Math.PI*2);

  ctx.fill();

  ctx.shadowBlur=0;
 }
}


/* =========================
   PARTICLES
========================= */

function drawParticles(){

 for(const p of particles){

  ctx.globalAlpha=Math.max(0,p.life/.7);

  ctx.fillStyle="#ff7b00";

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   p.size,
   0,
   Math.PI*2
  );

  ctx.fill();
 }

 ctx.globalAlpha=1;
}


/* =========================
   UI
========================= */

function updateUI(){

 document.getElementById("levelText").innerText=level;
 document.getElementById("scoreText").innerText=score;

 const hp=Math.max(0,hero.hp);

 document.getElementById("heroHP").style.width=
  hp+"%";

 document.getElementById("heroHP").style.background=
  hp<30?"red":"#22c55e";
}

function updateBossBar(){

 if(!boss)return;

 document.getElementById("bossHPFill").style.width=
  Math.max(0,boss.hp/boss.maxHp*100)+"%";
}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

 const m=document.getElementById("message");

 m.innerHTML=text;

 m.style.display="block";

 setTimeout(()=>{

  if(running)
   m.style.display="none";

 },1200);
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

 running=false;

 spinning=false;
 ultraMode=false;
 trishulActive=false;

 document.getElementById("bossUI").style.display="none";

 document.getElementById("message").innerHTML=
  "💀 YOU DIED 💀<br><small>SCORE: "+
  score+"</small>";

 document.getElementById("message").style.display="block";

 document.getElementById("retry").style.display="block";
}


/* =========================
   RETRY
========================= */

function retryGame(){

 resetGame();

 running=true;

 startLevel();

 lastTime=performance.now();

 requestAnimationFrame(loop);
}


/* =========================
   VICTORY
========================= */

function victory(){

 running=false;

 boss=null;

 enemies=[];
 bullets=[];

 document.getElementById("message").innerHTML=
  "🏆 GHUMI GHUMI WINS 🏆"+
  "<br><small>ALL 10 LEVELS COMPLETED</small>"+
  "<br><small>SCORE: "+score+"</small>";

 document.getElementById("message").style.display="block";
}


/* =========================================================
   ONLY ONE GAME LOOP
========================================================= */

function loop(time){

 if(!running)return;

 let dt=(time-lastTime)/1000;

 lastTime=time;

 if(dt>.05)dt=.05;


 /*
    UPDATE
 */

 moveHero();

 updateLevel(dt);

 updateSpin(dt);

 updateUltra(dt);

 updateEnemies(dt);

 updateBoss(dt);

 updateBullets(dt);

 updateParticles(dt);


 /*
    DRAW
 */

 ctx.clearRect(0,0,W,H);

 drawBackground();

 drawParticles();

 drawBullets();

 for(const e of enemies)
  drawEnemy(e);

 drawBoss();

 drawHero();

 drawTrishul();

 updateUI();


 /*
    K = INVINCIBLE
 */

 if(!ultraMode&&hero.hp<=0){

  hero.hp=0;

  updateUI();

  gameOver();

  return;
 }


 requestAnimationFrame(loop);
}

updateUI();

</script>
