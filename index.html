<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallScore — QA Audit Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{--ink:#171B26;--paper:#F5F6FA;--card:#fff;--line:#E3E5EC;--teal:#0F9D8C;--indigo:#4C5FD5;--amber:#E29A2E;--coral:#E0574A;--muted:#6B7280}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}button,input,textarea,select{font:inherit}
header{background:var(--ink)}.header-inner{max-width:1180px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:38px;height:38px;border-radius:10px;background:var(--indigo);display:grid;place-items:center;color:white}.brand-name{font-weight:700;font-size:19px;color:#fff}.brand-sub{font-size:11px;color:#9ca3af}
nav{display:flex;gap:5px;background:#232A3B;padding:5px;border-radius:12px;flex-wrap:wrap}.tabbtn{border:0;background:transparent;color:#b9bec9;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}.tabbtn.active{background:var(--ink);color:#fff}
.who{display:flex;align-items:center;gap:9px;color:#b9bec9;font-size:13px}.logout-btn{background:none;border:1px solid #3a4256;color:#b9bec9;padding:7px 12px;border-radius:9px;cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:28px 24px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.grid{display:grid;gap:16px}.grid-stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.grid-2{grid-template-columns:1.3fr 1fr}
.stat-card{padding:16px 18px;display:flex;gap:14px;align-items:center}.stat-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}.stat-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.stat-value{font-size:22px;font-weight:600}
.section-title{font-family:"Space Grotesk";font-weight:600;font-size:15px;margin-bottom:16px}.field-label{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:6px}.text-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.text-input:focus{outline:none;border-color:var(--indigo)}
.btn-primary{width:100%;padding:11px;border:0;border-radius:10px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.btn-primary:disabled{opacity:.55}.btn-ghost{padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:600;cursor:pointer}.icon-btn{border:0;background:none;cursor:pointer}.empty{padding:60px;text-align:center;color:var(--muted)}.error-text{color:var(--coral);font-size:12px;min-height:16px;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}.badge-dot{width:6px;height:6px;border-radius:50%}
.notice{padding:11px 13px;background:#eef2ff;color:#3949a3;border-radius:10px;font-size:12px;margin-bottom:16px}.mono{font-family:"IBM Plex Mono",monospace}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(380px,100%);padding:32px;background:#fff;border:1px solid var(--line);border-radius:16px}.role-btn{width:100%;padding:15px;margin:0 0 10px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;font-weight:700;cursor:pointer}.pin-input{text-align:center;letter-spacing:6px;font-size:20px}.back-link{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;margin-bottom:14px}
.slider{width:100%}.audit-row{padding:16px 20px}.audit-row-top{display:flex;align-items:center;gap:10px}.audit-click{flex:1;display:flex;gap:14px;align-items:center;cursor:pointer}.avatar{width:34px;height:34px;border-radius:50%;background:#eef0ff;color:var(--indigo);display:grid;place-items:center;font-weight:700;flex-shrink:0}.audit-name{font-weight:700}.audit-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}.audit-detail{display:none;border-top:1px solid var(--line);margin-top:15px;padding-top:15px}.audit-detail.open{display:block}.param-bar-track{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.param-bar-fill{height:100%;background:var(--indigo)}.agent-history-card{padding:14px 20px;display:flex;align-items:center;gap:12px}
.pin-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
@media(max-width:800px){.grid-2{grid-template-columns:1fr}.header-inner,.wrap{padding-left:14px;padding-right:14px}.audit-row-top{align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, setDoc, doc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDzzu9WjtwVBLGgvkohYZdu_DGfuUUYCQw",
 authDomain:"qa---bha.firebaseapp.com",
 projectId:"qa---bha",
 storageBucket:"qa---bha.firebasestorage.app",
 messagingSenderId:"1034926863923",
 appId:"1:1034926863923:web:ff4750c712852087ebd546",
 measurementId:"G-1EWTRVBZZM"
};
const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);
window.CS={db,collection,getDocs,addDoc,setDoc,doc,deleteDoc,onSnapshot,query,orderBy};
</script>

<script>
const PARAMETERS=[
 {key:"warmWelcome",label:"Warm Welcome",max:10},
 {key:"tone",label:"Tone & Communication / Active Listening",max:10},
 {key:"probing",label:"Requirement Probing & Call Control",max:10},
 {key:"serviceExplain",label:"Service Explain",max:20},
 {key:"usp",label:"USP Handling",max:15},
 {key:"urgency",label:"Urgency Creation",max:15},
 {key:"closing",label:"Closing Skills",max:10},
 {key:"followup",label:"Follow-up",max:10}
];
const MAX_TOTAL=100;
const COLORS={ink:"#171B26",paper:"#F5F6FA",card:"#fff",line:"#E3E5EC",teal:"#0F9D8C",indigo:"#4C5FD5",amber:"#E29A2E",coral:"#E0574A",muted:"#6B7280"};
const DEFAULT_ADMIN_PIN="1234";
let audits=[],agentPins={},adminPin=DEFAULT_ADMIN_PIN,role=null,currentAgentName=null,tab="overview",charts={},currentScores={};

function band(p){return p>=90?{label:"Excellent",color:COLORS.teal}:p>=75?{label:"Good",color:COLORS.indigo}:p>=60?{label:"Average",color:COLORS.amber}:{label:"Needs Improvement",color:COLORS.coral}}
function uid(){return"aud_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function genPin(){return String(Math.floor(1000+Math.random()*9000))}
function badgeHTML(b){return`<span class="badge" style="color:${b.color};background:${b.color}18"><span class="badge-dot" style="background:${b.color}"></span>${b.label}</span>`}
function statCard(i,l,v,a=COLORS.indigo){return`<div class="card stat-card"><div class="stat-icon" style="background:${a}18;color:${a}">${i}</div><div><div class="stat-label">${l}</div><div class="stat-value mono">${v}</div></div></div>`}
function ring(p,size,color){const sw=5,r=(size-sw)/2,c=2*Math.PI*r,o=c-(Math.min(p,100)/100)*c;return`<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${COLORS.line}" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${o}" stroke-linecap="round"/><text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" transform="rotate(90 ${size/2} ${size/2})" style="font-family:IBM Plex Mono;font-size:${size*.25}px;fill:${COLORS.ink}">${Math.round(p)}</text></svg>`}
function destroyCharts(){Object.values(charts).forEach(c=>c?.destroy());charts={}}

async function loadAll(){
 try{
  const [aSnap,gSnap,sSnap]=await Promise.all([
   CS.getDocs(CS.query(CS.collection(CS.db,"audits"),CS.orderBy("createdAt","desc"))),
   CS.getDocs(CS.collection(CS.db,"agents")),
   CS.getDocs(CS.collection(CS.db,"settings"))
  ]);
  audits=aSnap.docs.map(d=>({id:d.id,...d.data()}));
  agentPins={};gSnap.docs.forEach(d=>{const x=d.data();if(x.name)agentPins[x.name]=String(x.pin||"")});
  const admin=sSnap.docs.find(d=>d.id==="admin");adminPin=admin?.data()?.pin||DEFAULT_ADMIN_PIN;
 }catch(e){
  console.error(e);
  try{audits=JSON.parse(localStorage.getItem("qa_audits")||"[]");agentPins=JSON.parse(localStorage.getItem("qa_agent_pins")||"{}");adminPin=localStorage.getItem("qa_admin_pin")||DEFAULT_ADMIN_PIN}catch(_){}
 }
}
async function saveAudit(record){
 try{const ref=await CS.addDoc(CS.collection(CS.db,"audits"),record);record.id=ref.id;audits=[record,...audits.filter(a=>a.id!==record.id)];return true}catch(e){console.error(e);alert("Could not save evaluation. Check Firestore rules.");return false}
}
async function saveAgent(name,pin){
 try{const safe=btoa(unescape(encodeURIComponent(name))).replace(/[^A-Za-z0-9_-]/g,"_").slice(0,90);await CS.setDoc(CS.doc(CS.db,"agents",safe),{name,pin:String(pin),updatedAt:Date.now()},{merge:true});agentPins[name]=String(pin);return true}catch(e){console.error(e);alert("Could not save agent. Check Firestore rules.");return false}
}
async function saveAdminPin(pin){
 try{await CS.setDoc(CS.doc(CS.db,"settings","admin"),{pin:String(pin),updatedAt:Date.now()},{merge:true});adminPin=String(pin);return true}catch(e){console.error(e);alert("Could not save admin PIN. Check Firestore rules.");return false}
}
async function deleteAudit(id){
 try{await CS.deleteDoc(CS.doc(CS.db,"audits",id));audits=audits.filter(a=>a.id!==id)}catch(e){alert("Could not delete evaluation. Check Firestore rules.")}
}
function agentNames(){return Object.keys(agentPins).sort()}

function loginChooserHTML(){return`<div class="login-wrap"><div class="login-card"><div class="brand" style="justify-content:center;margin-bottom:22px"><div class="brand-icon">📋</div><div><div class="brand-name" style="color:var(--ink)">CallScore</div><div class="brand-sub" style="color:var(--muted)">QA Audit Desk</div></div></div><div id="login-body"><div class="field-label">I am signing in as</div><button class="role-btn" id="pick-admin">🛡️ QA Admin / Auditor</button><button class="role-btn" id="pick-agent">🎧 Agent — view my scores</button></div></div></div>`}
function renderApp(){destroyCharts();const app=document.getElementById("app");if(!role){app.innerHTML=loginChooserHTML();document.getElementById("pick-admin").onclick=showAdminLogin;document.getElementById("pick-agent").onclick=showAgentLogin;return}app.innerHTML=shellHTML();wireShell()}
function showAdminLogin(){document.getElementById("login-body").innerHTML=`<button class="back-link" id="back">← back</button><div class="field-label">Admin PIN</div><input id="admin-pin" class="text-input pin-input" maxlength="4" inputmode="numeric" placeholder="••••"><div id="err" class="error-text"></div><button id="submit" class="btn-primary">Unlock Admin Dashboard</button>`;document.getElementById("back").onclick=renderApp;const i=document.getElementById("admin-pin"),go=()=>{if(i.value.trim()===String(adminPin)){role="admin";tab="overview";renderApp()}else document.getElementById("err").textContent="Incorrect PIN."};document.getElementById("submit").onclick=go;i.onkeydown=e=>e.key==="Enter"&&go();i.focus()}
function showAgentLogin(){const names=agentNames();document.getElementById("login-body").innerHTML=`<button class="back-link" id="back">← back</button><div class="field-label">Your Name</div>${names.length?`<select id="agent-name" class="text-input">${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select>`:`<div class="notice">No agents have been added yet. Ask your QA admin.</div>`}<div class="field-label" style="margin-top:14px">Your PIN</div><input id="agent-pin" class="text-input pin-input" maxlength="4" inputmode="numeric" placeholder="••••"><div id="err" class="error-text"></div><button id="submit" class="btn-primary" ${names.length?"":"disabled"}>View My Scores</button>`;document.getElementById("back").onclick=renderApp;if(!names.length)return;const i=document.getElementById("agent-pin"),go=()=>{const n=document.getElementById("agent-name").value;if(agentPins[n]===i.value.trim()){role="agent";currentAgentName=n;tab="agent";renderApp()}else document.getElementById("err").textContent="Incorrect PIN."};document.getElementById("submit").onclick=go;i.onkeydown=e=>e.key==="Enter"&&go()}
function logout(){role=null;currentAgentName=null;tab="overview";renderApp()}
function shellHTML(){return`<header><div class="header-inner"><div class="brand"><div class="brand-icon">📋</div><div><div class="brand-name">CallScore</div><div class="brand-sub">QA Audit Desk · 100-point scorecard</div></div></div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><nav id="nav"></nav><div class="who">${role==="admin"?"🛡️ Admin":"🎧 "+esc(currentAgentName)}<button class="logout-btn" id="logout">Sign out</button></div></div></div></header><main class="wrap" id="content"></main>`}
function wireShell(){document.getElementById("logout").onclick=logout;renderNav();renderTabContent()}
function renderNav(){const ts=role==="admin"?[{id:"overview",l:"Overview",i:"📊"},{id:"new",l:"New Audit",i:"➕"},{id:"all",l:"All Audits",i:"📞"},{id:"pins",l:"Manage PINs",i:"🔑"}]:[{id:"agent",l:"My Scores",i:"👤"}];document.getElementById("nav").innerHTML=ts.map(t=>`<button class="tabbtn ${tab===t.id?"active":""}" data-tab="${t.id}">${t.i} ${t.l}</button>`).join("");document.querySelectorAll(".tabbtn").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderTabContent()})}
function renderTabContent(){destroyCharts();renderNav();const c=document.getElementById("content");if(role==="admin"){c.innerHTML=tab==="overview"?overviewHTML():tab==="new"?newAuditHTML():tab==="all"?allAuditsHTML():pinsHTML();if(tab==="overview")wireOverview();if(tab==="new")wireNewAudit();if(tab==="all")wireAllAudits();if(tab==="pins")wirePins()}else{c.innerHTML="<div id='agent-content'></div>";renderAgentContent()}}
function overviewHTML(){if(!audits.length)return`<div class="card empty">📋<br><br>No audits yet. Go to New Audit.</div>`;const avg=audits.reduce((s,a)=>s+a.total,0)/audits.length,p=avg/MAX_TOTAL*100,b=band(p);return`<div class="grid grid-stats" style="margin-bottom:24px">${statCard("📞","Calls Audited",audits.length)}${statCard("👥","Agents Covered",agentNames().length)}${statCard("📈","Team Average",p.toFixed(1)+"%",b.color)}</div><div class="grid grid-2"><div class="card" style="padding:20px"><div class="section-title">Agent Leaderboard</div><canvas id="leader" height="250"></canvas></div><div class="card" style="padding:20px"><div class="section-title">Team Strength by Parameter</div><canvas id="team" height="260"></canvas></div></div>`}
function wireOverview(){if(!audits.length)return;const names=agentNames(),pa=names.map(n=>{const l=audits.filter(a=>a.agentName===n),v=l.reduce((s,a)=>s+a.total,0)/l.length/MAX_TOTAL*100;return[n,v]}).sort((a,b)=>b[1]-a[1]);charts.leader=new Chart(document.getElementById("leader"),{type:"bar",data:{labels:pa.map(x=>x[0]),datasets:[{data:pa.map(x=>x[1]),backgroundColor:pa.map(x=>band(x[1]).color),borderRadius:6}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{min:0,max:100},y:{grid:{display:false}}}}});const pp=PARAMETERS.map(p=>{const v=audits.reduce((s,a)=>s+a.scores[p.key],0)/audits.length/p.max*100;return[p.label.split(" / ")[0],v]});charts.team=new Chart(document.getElementById("team"),{type:"radar",data:{labels:pp.map(x=>x[0]),datasets:[{data:pp.map(x=>x[1]),borderColor:COLORS.indigo,backgroundColor:COLORS.indigo+"55"}]},options:{plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{display:false}}}}})}
function defaultScores(){return Object.fromEntries(PARAMETERS.map(p=>[p.key,Math.round(p.max*.7)]))}
function newAuditHTML(){currentScores=defaultScores();const t=Object.values(currentScores).reduce((a,b)=>a+b,0),p=t/MAX_TOTAL*100,b=band(p);return`<form id="audit-form" class="card" style="padding:24px;display:flex;gap:22px"><div style="flex:1"><div class="section-title">Score a Call</div><div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:20px"><div><label class="field-label">Agent Name</label><input id="f-agent" class="text-input" list="agents" required><datalist id="agents">${agentNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div><div><label class="field-label">Auditor Name</label><input id="f-auditor" class="text-input" required></div><div><label class="field-label">Call ID</label><input id="f-callid" class="text-input"></div><div><label class="field-label">Call Date</label><input id="f-date" type="date" class="text-input" value="${new Date().toISOString().slice(0,10)}"></div></div>${PARAMETERS.map(x=>`<div style="margin:0 0 15px"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">${x.label}</b><span id="v-${x.key}" class="mono">${currentScores[x.key]}/${x.max}</span></div><input class="slider" type="range" min="0" max="${x.max}" value="${currentScores[x.key]}" data-key="${x.key}" data-max="${x.max}"></div>`).join("")}<label class="field-label">Remarks / Coaching Notes</label><textarea id="f-remarks" class="text-input" rows="3"></textarea></div><div style="width:180px;display:grid;place-items:center;align-content:center;gap:12px"><div class="field-label">Total Score</div><div id="ring">${ring(p,110,b.color)}</div><div id="fraction" class="mono">${t}/100</div><div id="badge">${badgeHTML(b)}</div><button class="btn-primary" id="save" type="submit">Save Evaluation</button><div id="saved" class="error-text"></div></div></form>`}
function wireNewAudit(){document.querySelectorAll(".slider").forEach(s=>s.oninput=e=>{const k=e.target.dataset.key;currentScores[k]=+e.target.value;document.getElementById("v-"+k).textContent=`${currentScores[k]}/${e.target.dataset.max}`;const t=PARAMETERS.reduce((z,p)=>z+currentScores[p.key],0),p=t/100*100,b=band(p);document.getElementById("ring").innerHTML=ring(p,110,b.color);document.getElementById("fraction").textContent=t+"/100";document.getElementById("badge").innerHTML=badgeHTML(b)});document.getElementById("audit-form").onsubmit=async e=>{e.preventDefault();const name=document.getElementById("f-agent").value.trim(),aud=document.getElementById("f-auditor").value.trim();if(!name||!aud)return;const btn=document.getElementById("save");btn.disabled=true;btn.textContent="Saving…";const total=PARAMETERS.reduce((s,p)=>s+currentScores[p.key],0);const rec={agentName:name,auditorName:aud,callId:document.getElementById("f-callid").value.trim()||"—",date:document.getElementById("f-date").value,scores:{...currentScores},remarks:document.getElementById("f-remarks").value.trim(),total,createdAt:Date.now()};const ok=await saveAudit(rec);if(!agentPins[name]){const pin=genPin();await saveAgent(name,pin);document.getElementById("saved").style.color=COLORS.teal;document.getElementById("saved").textContent=`✓ Saved. Agent PIN: ${pin}`;alert(`New agent PIN for ${name}: ${pin}`)}else{document.getElementById("saved").style.color=COLORS.teal;document.getElementById("saved").textContent=ok?"✓ Evaluation saved to Firebase.":"Saved locally."}btn.disabled=false;btn.textContent="Save Evaluation"}}
function allAuditsHTML(){return audits.length?`<input id="filter" class="text-input" style="max-width:320px;margin-bottom:16px" placeholder="Filter by agent or call ID…"><div id="list" style="display:grid;gap:12px"></div>`:`<div class="card empty">No evaluations yet.</div>`}
function auditRow(a){const p=a.total/100*100,b=band(p),ini=a.agentName.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();return`<div class="card audit-row" data-id="${a.id}"><div class="audit-row-top"><div class="audit-click"><div class="avatar">${ini}</div><div><div class="audit-name">${esc(a.agentName)}</div><div class="audit-meta">${esc(a.date)} · Call ${esc(a.callId)} · Auditor: ${esc(a.auditorName)}</div></div></div>${badgeHTML(b)}${ring(p,44,b.color)}<button class="icon-btn del">🗑️</button><button class="icon-btn tog">▾</button></div><div class="audit-detail">${PARAMETERS.map(x=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${x.label}</span><b>${a.scores[x.key]}/${x.max}</b></div><div class="param-bar-track"><div class="param-bar-fill" style="width:${a.scores[x.key]/x.max*100}%"></div></div></div>`).join("")}${a.remarks?`<div class="notice"><b>Remarks:</b> ${esc(a.remarks)}</div>`:""}</div></div>`}
function wireAllAudits(){const draw=f=>{const x=audits.filter(a=>(a.agentName+" "+a.callId).toLowerCase().includes(f.toLowerCase()));document.getElementById("list").innerHTML=x.map(auditRow).join("");document.querySelectorAll(".tog,.audit-click").forEach(e=>e.onclick=()=>{const d=e.closest(".audit-row").querySelector(".audit-detail");d.classList.toggle("open")});document.querySelectorAll(".del").forEach(e=>e.onclick=async()=>{await deleteAudit(e.closest(".audit-row").dataset.id);draw(document.getElementById("filter").value)})};draw("");document.getElementById("filter").oninput=e=>draw(e.target.value)}
function pinsHTML(){return`<div class="grid grid-2"><div class="card" style="padding:22px"><div class="section-title">Agent PINs</div>${agentNames().map(n=>`<div class="pin-row"><div><b>${esc(n)}</b><div class="mono" style="font-size:12px;color:var(--muted)">PIN: ${esc(agentPins[n])}</div></div><button class="btn-ghost regen" data-name="${esc(n)}">Regenerate</button></div>`).join("")}<div style="display:flex;gap:8px;margin-top:18px"><input id="new-agent" class="text-input" placeholder="Add agent name"><button id="add-agent" class="btn-ghost">Add + Generate PIN</button></div></div><div class="card" style="padding:22px"><div class="section-title">Admin PIN</div><input id="new-admin" class="text-input pin-input" maxlength="4" placeholder="••••"><button id="change-admin" class="btn-primary" style="margin-top:12px">Update Admin PIN</button><div id="pin-msg" class="error-text"></div></div></div>`}
function wirePins(){document.querySelectorAll(".regen").forEach(b=>b.onclick=async()=>{await saveAgent(b.dataset.name,genPin());renderTabContent()});document.getElementById("add-agent").onclick=async()=>{const n=document.getElementById("new-agent").value.trim();if(n&&!agentPins[n])await saveAgent(n,genPin());renderTabContent()};document.getElementById("change-admin").onclick=async()=>{const v=document.getElementById("new-admin").value.trim();if(!/^\d{4}$/.test(v)){document.getElementById("pin-msg").textContent="PIN must be 4 digits.";return}await saveAdminPin(v);document.getElementById("pin-msg").style.color=COLORS.teal;document.getElementById("pin-msg").textContent="Admin PIN updated."}}
function renderAgentContent(){const list=audits.filter(a=>a.agentName===currentAgentName).sort((a,b)=>a.createdAt-b.createdAt),el=document.getElementById("agent-content");if(!list.length){el.innerHTML=`<div class="notice">☁️ Connected to Firebase. No evaluation has been assigned to you yet.</div><div class="card empty">No calls audited for you yet.</div>`;return}const avg=list.reduce((s,a)=>s+a.total,0)/list.length,p=avg/100*100,b=band(p);el.innerHTML=`<div class="notice">☁️ Your evaluations are loaded from Firebase. <button id="refresh" class="btn-ghost" style="float:right">Refresh</button></div><div class="grid grid-stats" style="margin-bottom:20px">${statCard("📞","Calls Audited",list.length)}${statCard("📈","Average Score",p.toFixed(1)+"%",b.color)}${statCard("📋","Latest",list[list.length-1].total+"%")}</div><div class="grid grid-2" style="margin-bottom:20px"><div class="card" style="padding:20px"><div class="section-title">Score Trend</div><canvas id="trend" height="220"></canvas></div><div class="card" style="padding:20px"><div class="section-title">Strengths & Gaps</div><canvas id="radar" height="220"></canvas></div></div><div class="section-title">My Evaluations</div><div style="display:grid;gap:12px">${[...list].reverse().map(a=>{const q=a.total,bx=band(q);return`<div class="card agent-history-card"><div style="flex:1"><b>Call ${esc(a.callId)}</b><div style="font-size:12px;color:var(--muted)">${esc(a.date)} · Audited by ${esc(a.auditorName)}</div>${a.remarks?`<div style="font-size:12.5px;margin-top:6px">${esc(a.remarks)}</div>`:""}</div>${badgeHTML(bx)}${ring(q,44,bx.color)}</div>`}).join("")}</div>`;document.getElementById("refresh").onclick=async()=>{await loadAll();renderAgentContent()};charts.trend=new Chart(document.getElementById("trend"),{type:"line",data:{labels:list.map((_,i)=>"#"+(i+1)),datasets:[{data:list.map(a=>a.total),borderColor:COLORS.indigo,backgroundColor:COLORS.indigo,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}});const pa=PARAMETERS.map(p=>[p.label,list.reduce((s,a)=>s+a.scores[p.key],0)/list.length/p.max*100]);charts.radar=new Chart(document.getElementById("radar"),{type:"radar",data:{labels:pa.map(x=>x[0]),datasets:[{data:pa.map(x=>x[1]),borderColor:b.color,backgroundColor:b.color+"55"}]},options:{plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{display:false}}}}})}

(async()=>{document.getElementById("app").innerHTML=`<div class="empty">Connecting to Firebase…</div>`;await loadAll();renderApp()})();
</script>
</body>
