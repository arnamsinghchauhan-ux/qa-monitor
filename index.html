<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ghumi Ghumi Dark Battle</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030305;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    display:block;
}

/* TOP UI */
#ui{
    position:fixed;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.panel{
    background:rgba(0,0,0,.82);
    border:1px solid #333;
    border-radius:14px;
    padding:10px 15px;
    box-shadow:0 5px 25px #000;
}

.bar{
    width:260px;
    height:18px;
    background:#320505;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px;
}

#heroHP{
    width:100%;
    height:100%;
    background:#22c55e;
    transition:.1s;
}

/* BOSS UI */
#bossUI{
    position:fixed;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    width:400px;
    text-align:center;
    display:none;
    z-index:10;
}

#bossName{
    font-size:22px;
    font-weight:bold;
    color:#ff2222;
    text-shadow:0 0 10px red,0 0 25px red;
    margin-bottom:6px;
}

#bossHP{
    width:100%;
    height:20px;
    background:#300000;
    border-radius:20px;
    overflow:hidden;
}

#bossHPFill{
    width:100%;
    height:100%;
    background:#ef1111;
}

/* MESSAGE */
#message{
    position:fixed;
    top:42%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    display:none;
    text-align:center;
    font-size:45px;
    font-weight:bold;
    white-space:nowrap;
    text-shadow:0 0 15px red,0 0 35px red;
}

/* RETRY */
#retry{
    position:fixed;
    top:58%;
    left:50%;
    transform:translateX(-50%);
    z-index:31;
    display:none;
    padding:15px 45px;
    border:0;
    border-radius:30px;
    background:linear-gradient(90deg,#dc2626,#7f1d1d);
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

#retry:hover{
    transform:translateX(-50%) scale(1.08);
    box-shadow:0 0 35px red;
}

/* CONTROLS */
#controls{
    position:fixed;
    bottom:10px;
    left:10px;
    z-index:10;
    background:rgba(0,0,0,.75);
    padding:9px 13px;
    border-radius:10px;
    font-size:13px;
}

/* START SCREEN */
#startScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#380707,#030305 70%);
}

.startBox{
    text-align:center;
    padding:50px;
    border-radius:28px;
    background:#ffffff08;
    border:1px solid #ff222233;
    box-shadow:0 0 100px #ff000022;
}

.startBox h1{
    margin:0;
    font-size:58px;
    color:#ff2222;
    text-shadow:0 0 15px red,0 0 40px red;
}

.startBox h2{
    color:#ddd;
}

.startBox p{
    color:#aaa;
}

.startBtn{
    margin-top:20px;
    padding:15px 45px;
    border:0;
    border-radius:30px;
    background:linear-gradient(90deg,#dc2626,#7f1d1d);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.startBtn:hover{
    transform:scale(1.07);
    box-shadow:0 0 35px red;
}
</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen">

    <div class="startBox">

        <h1>🌀 GHUMI GHUMI 🌀</h1>

        <h2>GHUMI GHUMI DARK BATTLE</h2>

        <p>10 Levels • Different Enemies • Powerful Bosses</p>

        <p>Defeat every boss and reach The Dark God.</p>

        <button class="startBtn" onclick="startGame()">
            START BATTLE
        </button>

    </div>

</div>


<!-- UI -->

<div id="ui">

    <div class="panel">

        ❤️ HERO HP

        <div class="bar">
            <div id="heroHP"></div>
        </div>

    </div>


    <div class="panel">

        LEVEL <b id="levelText">1</b> / 10

        &nbsp;&nbsp;

        SCORE <b id="scoreText">0</b>

        <br>

        ⚡ <span id="powerText">READY</span>

    </div>

</div>


<!-- BOSS -->

<div id="bossUI">

    <div id="bossName">
        BOSS
    </div>

    <div id="bossHP">

        <div id="bossHPFill"></div>

    </div>

</div>


<!-- MESSAGE -->

<div id="message"></div>


<!-- RETRY -->

<button id="retry" onclick="retryGame()">
    🔄 RETRY
</button>


<!-- CONTROLS -->

<div id="controls">

    <b>W A S D</b> Move &nbsp;|&nbsp;

    <b>SPACE / CLICK</b> Sword &nbsp;|&nbsp;

    <b>T</b> Ghumi Spin &nbsp;|&nbsp;

    <b>K</b> Ultra

</div>


<canvas id="game"></canvas>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W =
    window.innerWidth;

let H =
    window.innerHeight;


function resize(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

}


resize();


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let running = false;

let level = 1;

let score = 0;

let enemies = [];

let boss = null;

let bullets = [];

let particles = [];

let keys = {};

let levelTime = 0;

let spawnTimer = 0;

let bossCountdown = false;

let swordActive = false;

let spinning = false;

let ultra = false;

let spinAngle = 0;

let lastTime = 0;


/* =====================================================
   HERO
===================================================== */

const hero = {

    x:W/2,

    y:H/2,

    r:25,

    speed:5.5,

    hp:100,

    maxHp:100

};


/* =====================================================
   ENEMY TYPES
===================================================== */

const enemyTypes = {

    beast:{
        hp:45,
        speed:2.2,
        damage:7,
        r:23,
        color:"#8f1111"
    },

    hunter:{
        hp:75,
        speed:3.3,
        damage:9,
        r:21,
        color:"#4b1d80"
    },

    demon:{
        hp:120,
        speed:2.8,
        damage:12,
        r:28,
        color:"#701111"
    },

    brute:{
        hp:260,
        speed:1.25,
        damage:18,
        r:36,
        color:"#39393f"
    },

    shadow:{
        hp:170,
        speed:3.8,
        damage:15,
        r:25,
        color:"#10131d"
    },

    monster:{
        hp:350,
        speed:1.8,
        damage:23,
        r:43,
        color:"#54177c"
    }

};


/* =====================================================
   BOSS DATA
===================================================== */

const bossData = [

    {
        name:"BLOOD REAPER",
        hp:1800,
        speed:.75,
        damage:25
    },

    {
        name:"DARK HUNTER",
        hp:2400,
        speed:.82,
        damage:28
    },

    {
        name:"SKULL LORD",
        hp:3200,
        speed:.88,
        damage:31
    },

    {
        name:"HELL BRUTE",
        hp:4200,
        speed:.75,
        damage:35
    },

    {
        name:"DEMON KING",
        hp:5400,
        speed:.92,
        damage:38
    },

    {
        name:"NIGHTMARE",
        hp:6800,
        speed:1,
        damage:42
    },

    {
        name:"VOID WARRIOR",
        hp:8500,
        speed:1.05,
        damage:46
    },

    {
        name:"DARK TITAN",
        hp:10500,
        speed:.92,
        damage:50
    },

    {
        name:"HELL EMPEROR",
        hp:13000,
        speed:1.08,
        damage:55
    },

    {
        name:"THE DARK GOD",
        hp:18000,
        speed:1.12,
        damage:65
    }

];


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    function(e){

        const key =
            e.key.toLowerCase();

        keys[key] = true;


        if(key === "t"){

            startSpin();

        }


        if(key === "k"){

            ultraAttack();

        }


        if(e.code === "Space"){

            e.preventDefault();

            swordAttack();

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        const key =
            e.key.toLowerCase();

        keys[key] = false;


        if(key === "k"){

            ultra = false;

            document.getElementById(
                "powerText"
            ).innerText =
                "READY";

        }

    }
);


canvas.addEventListener(
    "mousedown",
    function(){

        swordAttack();

    }
);


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    document.getElementById(
        "startScreen"
    ).style.display =
        "none";


    resetGame();

    running = true;

    startLevel();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    running = false;

    level = 1;

    score = 0;

    enemies = [];

    bullets = [];

    particles = [];

    boss = null;

    levelTime = 0;

    spawnTimer = 0;

    bossCountdown = false;

    swordActive = false;

    spinning = false;

    ultra = false;

    spinAngle = 0;


    hero.x =
        W/2;

    hero.y =
        H/2;

    hero.hp =
        hero.maxHp;


    document.getElementById(
        "retry"
    ).style.display =
        "none";


    document.getElementById(
        "message"
    ).style.display =
        "none";


    document.getElementById(
        "bossUI"
    ).style.display =
        "none";


    document.getElementById(
        "powerText"
    ).innerText =
        "READY";

}


/* =====================================================
   LEVEL START
===================================================== */

function startLevel(){

    enemies = [];

    bullets = [];

    boss = null;

    levelTime = 0;

    spawnTimer = 0;

    bossCountdown = false;

    swordActive = false;

    spinning = false;

    ultra = false;


    document.getElementById(
        "bossUI"
    ).style.display =
        "none";


    document.getElementById(
        "powerText"
    ).innerText =
        "READY";


    showMessage(
        "LEVEL " + level
    );

}


/* =====================================================
   ENEMY POOL
===================================================== */

function getEnemyPool(){

    if(level === 1)
        return ["beast"];

    if(level === 2)
        return ["beast","hunter"];

    if(level === 3)
        return ["hunter","demon"];

    if(level === 4)
        return ["beast","hunter","demon"];

    if(level === 5)
        return ["demon","brute"];

    if(level === 6)
        return ["hunter","brute","shadow"];

    if(level === 7)
        return ["demon","brute","shadow"];

    if(level === 8)
        return ["brute","shadow","monster"];

    if(level === 9)
        return ["shadow","monster","demon","brute"];

    return ["shadow","monster","brute"];

}


/* =====================================================
   SPAWN ENEMY
===================================================== */

function spawnEnemy(){

    const pool =
        getEnemyPool();


    const type =
        pool[
            Math.floor(
                Math.random()*pool.length
            )
        ];


    const data =
        enemyTypes[type];


    const side =
        Math.floor(
            Math.random()*4
        );


    let x;
    let y;


    if(side === 0){

        x = -80;
        y = Math.random()*H;

    }

    else if(side === 1){

        x = W+80;
        y = Math.random()*H;

    }

    else if(side === 2){

        x = Math.random()*W;
        y = -80;

    }

    else{

        x = Math.random()*W;
        y = H+80;

    }


    const difficulty =
        1+
        (level-1)*.18;


    enemies.push({

        x:x,

        y:y,

        r:data.r,

        hp:
            data.hp*
            difficulty,

        maxHp:
            data.hp*
            difficulty,

        speed:
            data.speed*
            (1+(level-1)*.06),

        damage:
            data.damage*
            difficulty,

        color:data.color,

        flash:0

    });

}


/* =====================================================
   SPAWN BOSS
===================================================== */

function spawnBoss(){

    if(boss !== null)
        return;


    const data =
        bossData[level-1];


    boss = {

        name:data.name,

        x:W/2,

        y:140,

        r:
            75+
            level*3,

        hp:data.hp,

        maxHp:data.hp,

        speed:data.speed,

        damage:data.damage,

        attackTimer:0,

        chargeTimer:0,

        chargeTime:0,

        flash:0

    };


    document.getElementById(
        "bossName"
    ).innerText =
        "☠ " +
        boss.name +
        " ☠";


    document.getElementById(
        "bossUI"
    ).style.display =
        "block";


    updateBossBar();


    showMessage(
        "☠ " +
        boss.name +
        " ☠"
    );

}


/* =====================================================
   HERO MOVEMENT
===================================================== */

function moveHero(){

    let dx=0;

    let dy=0;


    if(keys.w)
        dy--;

    if(keys.s)
        dy++;

    if(keys.a)
        dx--;

    if(keys.d)
        dx++;


    if(
        dx !== 0 ||
        dy !== 0
    ){

        const length =
            Math.hypot(
                dx,
                dy
            );


        dx/=length;

        dy/=length;


        hero.x +=
            dx*
            hero.speed;


        hero.y +=
            dy*
            hero.speed;

    }


    hero.x =
        Math.max(
            hero.r,
            Math.min(
                W-hero.r,
                hero.x
            )
        );


    hero.y =
        Math.max(
            80,
            Math.min(
                H-hero.r,
                hero.y
            )
        );

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =====================================================
   SWORD
===================================================== */

function swordAttack(){

    if(
        !running ||
        spinning
    )
        return;


    swordActive = true;


    setTimeout(
        function(){

            swordActive = false;

        },
        180
    );


    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];


        if(
            distance(
                hero,
                enemy
            )
            <
            120
        ){

            enemy.hp -= 35;

            enemy.flash = 5;

            createHit(
                enemy.x,
                enemy.y
            );


            if(
                enemy.hp<=0
            ){

                score += 100;

                enemies.splice(
                    i,
                    1
                );

            }

        }

    }


    if(boss !== null){

        if(
            distance(
                hero,
                boss
            )
            <
            150
        ){

            boss.hp -= 35;

            boss.flash = 5;

            createHit(
                boss.x,
                boss.y
            );


            if(
                boss.hp<=0
            ){

                defeatBoss();

            }

        }

    }

}


/* =====================================================
   T = GHUMI SPIN
===================================================== */

function startSpin(){

    if(
        !running ||
        spinning
    )
        return;


    spinning = true;


    document.getElementById(
        "powerText"
    ).innerText =
        "🌀 GHUMI GHUMI";


    const start =
        performance.now();


    function spinLoop(){

        if(!running){

            spinning = false;

            return;

        }


        spinAngle += .5;


        /*
            LOW DAMAGE
        */

        for(
            let i=enemies.length-1;
            i>=0;
            i--
        ){

            const enemy =
                enemies[i];


            if(
                distance(
                    hero,
                    enemy
                )
                <
                165
            ){

                enemy.hp -= 2;


                if(
                    enemy.hp<=0
                ){

                    score += 100;

                    enemies.splice(
                        i,
                        1
                    );

                }

            }

        }


        /*
            BOSS LOW DAMAGE
        */

        if(
            boss !== null &&
            distance(
                hero,
                boss
            )
            <
            170
        ){

            boss.hp -= 2;


            if(
                boss.hp<=0
            ){

                defeatBoss();

                return;

            }

        }


        if(
            performance.now()-
            start
            <
            1500
        ){

            requestAnimationFrame(
                spinLoop
            );

        }

        else{

            spinning = false;


            document.getElementById(
                "powerText"
            ).innerText =
                "READY";

        }

    }


    requestAnimationFrame(
        spinLoop
    );

}


/* =====================================================
   K = ULTRA
===================================================== */

function ultraAttack(){

    if(!running)
        return;


    ultra = true;


    document.getElementById(
        "powerText"
    ).innerText =
        "🔥 ULTRA ACTIVE";


    /*
        NORMAL ENEMIES:
        100% DAMAGE
    */

    for(
        const enemy
        of enemies
    ){

        enemy.hp = 0;

        score += 100;

        createExplosion(
            enemy.x,
            enemy.y
        );

    }


    enemies = [];


    /*
        BOSS:
        60% DAMAGE
    */

    if(
        boss !== null
    ){

        boss.hp -=
            boss.maxHp*
            .60;


        createExplosion(
            boss.x,
            boss.y
        );


        if(
            boss.hp<=0
        ){

            defeatBoss();

        }

        else{

            updateBossBar();

        }

    }

}


/* =====================================================
   NORMAL ENEMIES UPDATE
===================================================== */

function updateEnemies(){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];


        const dx =
            hero.x-
            enemy.x;


        const dy =
            hero.y-
            enemy.y;


        const dist =
            Math.hypot(
                dx,
                dy
            );


        if(
            dist>1
        ){

            enemy.x +=
                (dx/dist)*
                enemy.speed;


            enemy.y +=
                (dy/dist)*
                enemy.speed;

        }


        if(
            enemy.flash>0
        ){

            enemy.flash--;

        }


        /*
            ENEMY TOUCH DAMAGE
        */

        if(
            dist
            <=
            hero.r+
            enemy.r*.65
        ){

            hero.hp -=
                enemy.damage*
                .025;

        }


        if(
            enemy.hp<=0
        ){

            score += 100;

            enemies.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   BOSS UPDATE
===================================================== */

function updateBoss(){

    if(
        boss===null
    )
        return;


    const dx =
        hero.x-
        boss.x;


    const dy =
        hero.y-
        boss.y;


    const dist =
        Math.hypot(
            dx,
            dy
        );


    /*
        MOVE TOWARD HERO
    */

    if(
        dist>120
    ){

        boss.x +=
            (dx/dist)*
            boss.speed;


        boss.y +=
            (dy/dist)*
            boss.speed;

    }


    /*
        KEEP ON SCREEN
    */

    boss.x =
        Math.max(
            boss.r,
            Math.min(
                W-boss.r,
                boss.x
            )
        );


    boss.y =
        Math.max(
            110,
            Math.min(
                H-boss.r,
                boss.y
            )
        );


    /*
        TOUCH DAMAGE
    */

    if(
        dist
        <=
        hero.r+
        boss.r*.55
    ){

        hero.hp -=
            boss.damage*
            .035;

    }


    /*
        PROJECTILE ATTACK
    */

    boss.attackTimer++;


    if(
        boss.attackTimer>=90
    ){

        boss.attackTimer=0;


        const angle =
            Math.atan2(
                hero.y-boss.y,
                hero.x-boss.x
            );


        for(
            let i=-2;
            i<=2;
            i++
        ){

            const a =
                angle+
                i*.16;


            bullets.push({

                x:boss.x,

                y:boss.y,

                vx:
                    Math.cos(a)*
                    5,

                vy:
                    Math.sin(a)*
                    5,

                life:180,

                damage:
                    8+level

            });

        }

    }


    /*
        CHARGE ATTACK
    */

    boss.chargeTimer++;


    if(
        boss.chargeTimer>=330
    ){

        boss.chargeTimer=0;

        boss.chargeTime=45;

    }


    if(
        boss.chargeTime>0
    ){

        boss.chargeTime--;


        if(
            dist>1
        ){

            boss.x +=
                (dx/dist)*
                3.5;


            boss.y +=
                (dy/dist)*
                3.5;

        }

    }


    if(
        boss.flash>0
    ){

        boss.flash--;

    }


    updateBossBar();

}


/* =====================================================
   BOSS BAR
===================================================== */

function updateBossBar(){

    if(
        boss===null
    ){

        document.getElementById(
            "bossUI"
        ).style.display =
            "none";

        return;

    }


    const percent =
        Math.max(
            0,
            boss.hp/
            boss.maxHp*
            100
        );


    document.getElementById(
        "bossHPFill"
    ).style.width =
        percent+"%";

}


/* =====================================================
   BULLETS
===================================================== */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.vx;

        bullet.y +=
            bullet.vy;

        bullet.life--;


        if(
            distance(
                hero,
                bullet
            )
            <
            30
        ){

            hero.hp -=
                bullet.damage;


            createExplosion(
                hero.x,
                hero.y
            );


            bullets.splice(
                i,
                1
            );


            continue;

        }


        if(
            bullet.life<=0 ||
            bullet.x<-100 ||
            bullet.x>W+100 ||
            bullet.y<-100 ||
            bullet.y>H+100
        ){

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   LEVEL SYSTEM
===================================================== */

function updateLevel(dt){

    /*
        Boss active:
        no normal level logic.
    */

    if(
        boss!==null
    )
        return;


    if(
        bossCountdown
    )
        return;


    levelTime += dt;


    /*
        20 seconds of enemies
    */

    if(
        levelTime<20
    ){

        spawnTimer += dt;


        const spawnRate =
            Math.max(
                .18,
                .65-
                level*.035
            );


        if(
            spawnTimer>=spawnRate
        ){

            spawnTimer=0;


            /*
                More enemies
                at higher levels.
            */

            let amount =
                1+
                Math.floor(
                    level/2
                );


            if(
                Math.random()<.5
            ){

                amount++;

            }


            for(
                let i=0;
                i<amount;
                i++
            ){

                spawnEnemy();

            }

        }


        return;

    }


    /*
        Wait for all enemies
    */

    if(
        enemies.length===0
    ){

        bossCountdown=true;


        showMessage(
            "⚠ BOSS INCOMING ⚠"
        );


        setTimeout(
            function(){

                if(
                    running &&
                    boss===null
                ){

                    spawnBoss();

                }

            },
            1200
        );

    }

}


/* =====================================================
   DEFEAT BOSS
===================================================== */

function defeatBoss(){

    if(
        boss===null
    )
        return;


    createExplosion(
        boss.x,
        boss.y
    );


    score += 5000;


    boss=null;

    bullets=[];


    document.getElementById(
        "bossUI"
    ).style.display =
        "none";


    /*
        FINAL BOSS
    */

    if(
        level>=10
    ){

        victory();

        return;

    }


    showMessage(
        "👑 BOSS DEFEATED"
    );


    /*
        HP reward
    */

    hero.hp =
        Math.min(
            hero.maxHp,
            hero.hp+25
        );


    setTimeout(
        function(){

            if(
                !running
            )
                return;


            level++;


            startLevel();

        },
        2000
    );

}


/* =====================================================
   PARTICLES
===================================================== */

function createHit(x,y){

    for(
        let i=0;
        i<5;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*
                7,

            vy:
                (Math.random()-.5)*
                7,

            life:25,

            size:
                3+
                Math.random()*4

        });

    }

}


function createExplosion(x,y){

    for(
        let i=0;
        i<25;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*
                14,

            vy:
                (Math.random()-.5)*
                14,

            life:45,

            size:
                3+
                Math.random()*7

        });

    }

}


function updateParticles(){

    for(
        const p
        of particles
    ){

        p.x += p.vx;

        p.y += p.vy;

        p.vx *= .96;

        p.vy *= .96;

        p.life--;

    }


    particles =
        particles.filter(
            p=>p.life>0
        );

}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

    ctx.fillStyle =
        "#020205";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const gradient =
        ctx.createRadialGradient(
            W/2,
            H/2,
            30,
            W/2,
            H/2,
            Math.max(W,H)
        );


    gradient.addColorStop(
        0,
        "#300707"
    );


    gradient.addColorStop(
        1,
        "#020205"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for(
        let i=0;
        i<80;
        i++
    ){

        const x =
            (i*137)%W;


        const y =
            (i*83)%H;


        ctx.fillStyle =
            "#ffffff15";


        ctx.fillRect(
            x,
            y,
            2,
            2
        );

    }

}

/* =====================================================
   DRAW ENEMY
===================================================== */

function drawEnemy(enemy){

    ctx.save();


    ctx.translate(
        enemy.x,
        enemy.y
    );


    /*
        BODY
    */

    ctx.fillStyle =
        enemy.flash>0
        ?
        "white"
        :
        enemy.color;


    ctx.beginPath();


    ctx.roundRect(
        -enemy.r*.6,
        -enemy.r*.15,
        enemy.r*1.2,
        enemy.r*1.1,
        9
    );


    ctx.fill();


    /*
        ARMS
    */

    ctx.strokeStyle =
        enemy.color;


    ctx.lineWidth=10;


    ctx.beginPath();


    ctx.moveTo(
        -enemy.r*.5,
        0
    );


    ctx.lineTo(
        -enemy.r,
        enemy.r*.45
    );


    ctx.moveTo(
        enemy.r*.5,
        0
    );


    ctx.lineTo(
        enemy.r,
        enemy.r*.45
    );


    ctx.stroke();


    /*
        HEAD
    */

    ctx.fillStyle =
        "#63372b";


    ctx.beginPath();


    ctx.arc(
        0,
        -enemy.r*.55,
        enemy.r*.48,
        0,
        Math.PI*2
    );


    ctx.fill();


    /*
        HORNS
    */

    ctx.fillStyle =
        "#ddd";


    ctx.beginPath();


    ctx.moveTo(
        -enemy.r*.25,
        -enemy.r*.75
    );


    ctx.lineTo(
        -enemy.r*.65,
        -enemy.r*1.35
    );


    ctx.lineTo(
        -enemy.r*.05,
        -enemy.r*.9
    );


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        enemy.r*.25,
        -enemy.r*.75
    );


    ctx.lineTo(
        enemy.r*.65,
        -enemy.r*1.35
    );


    ctx.lineTo(
        enemy.r*.05,
        -enemy.r*.9
    );


    ctx.fill();


    /*
        EYES
    */

    ctx.fillStyle =
        "#ff0000";


    ctx.shadowBlur=15;

    ctx.shadowColor =
        "red";


    ctx.beginPath();


    ctx.arc(
        -enemy.r*.17,
        -enemy.r*.55,
        4,
        0,
        Math.PI*2
    );


    ctx.arc(
        enemy.r*.17,
        -enemy.r*.55,
        4,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.shadowBlur=0;


    /*
        ENEMY HP
    */

    ctx.fillStyle =
        "#200000";


    ctx.fillRect(
        -enemy.r,
        enemy.r*1.2,
        enemy.r*2,
        6
    );


    ctx.fillStyle =
        "#22c55e";


    ctx.fillRect(
        -enemy.r,
        enemy.r*1.2,
        enemy.r*2*
        Math.max(
            0,
            enemy.hp/
            enemy.maxHp
        ),
        6
    );


    ctx.restore();

}


/* =====================================================
   DRAW BOSS
===================================================== */

function drawBoss(){

    if(
        boss===null
    )
        return;


    ctx.save();


    ctx.translate(
        boss.x,
        boss.y
    );


    /*
        MASSIVE AURA
    */

    ctx.shadowBlur=40;

    ctx.shadowColor =
        "red";


    ctx.strokeStyle =
        "#ff000055";


    ctx.lineWidth=12;


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        boss.r*1.35+
        Math.sin(
            Date.now()/100
        )*10,
        0,
        Math.PI*2
    );


    ctx.stroke();


    ctx.shadowBlur=0;


    /*
        BODY
    */

    ctx.fillStyle =
        boss.flash>0
        ?
        "white"
        :
        "#260000";


    ctx.beginPath();


    ctx.roundRect(
        -boss.r*.65,
        -boss.r*.05,
        boss.r*1.3,
        boss.r*1.25,
        15
    );


    ctx.fill();


    /*
        SHOULDERS
    */

    ctx.fillStyle =
        "#4d0000";


    ctx.beginPath();


    ctx.arc(
        -boss.r*.75,
        0,
        boss.r*.4,
        0,
        Math.PI*2
    );


    ctx.arc(
        boss.r*.75,
        0,
        boss.r*.4,
        0,
        Math.PI*2
    );


    ctx.fill();


    /*
        HEAD
    */

    ctx.fillStyle =
        "#51251d";


    ctx.beginPath();


    ctx.arc(
        0,
        -boss.r*.65,
        boss.r*.52,
        0,
        Math.PI*2
    );


    ctx.fill();


    /*
        HORNS
    */

    ctx.fillStyle =
        "#ddd";


    ctx.beginPath();


    ctx.moveTo(
        -boss.r*.35,
        -boss.r*.85
    );


    ctx.lineTo(
        -boss.r*.75,
        -boss.r*1.55
    );


    ctx.lineTo(
        -boss.r*.05,
        -boss.r
    );


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        boss.r*.35,
        -boss.r*.85
    );


    ctx.lineTo(
        boss.r*.75,
        -boss.r*1.55
    );


    ctx.lineTo(
        boss.r*.05,
        -boss.r
    );


    ctx.fill();


    /*
        BOSS EYES
    */

    ctx.fillStyle =
        "#ff0000";


    ctx.shadowBlur=25;

    ctx.shadowColor =
        "red";


    ctx.beginPath();


    ctx.arc(
        -boss.r*.2,
        -boss.r*.65,
        7,
        0,
        Math.PI*2
    );


    ctx.arc(
        boss.r*.2,
        -boss.r*.65,
        7,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.shadowBlur=0;


    /*
        CROWN
    */

    ctx.fillStyle =
        "#ffd000";


    ctx.beginPath();


    ctx.moveTo(
        -boss.r*.55,
        -boss.r*1.55
    );


    ctx.lineTo(
        -boss.r*.3,
        -boss.r*2.05
    );


    ctx.lineTo(
        0,
        -boss.r*1.6
    );


    ctx.lineTo(
        boss.r*.3,
        -boss.r*2.05
    );


    ctx.lineTo(
        boss.r*.55,
        -boss.r*1.55
    );


    ctx.closePath();


    ctx.fill();


    /*
        BOSS HP
    */

    ctx.fillStyle =
        "#180000";


    ctx.fillRect(
        -boss.r*1.2,
        boss.r*1.45,
        boss.r*2.4,
        10
    );


    ctx.fillStyle =
        "#ef1111";


    ctx.fillRect(
        -boss.r*1.2,
        boss.r*1.45,
        boss.r*2.4*
        Math.max(
            0,
            boss.hp/
            boss.maxHp
        ),
        10
    );


    ctx.restore();

}


/* =====================================================
   DRAW BULLETS
===================================================== */

function drawBullets(){

    for(
        const bullet
        of bullets
    ){

        ctx.save();


        ctx.shadowBlur=20;

        ctx.shadowColor =
            "red";


        ctx.fillStyle =
            "#ff2222";


        ctx.beginPath();


        ctx.arc(
            bullet.x,
            bullet.y,
            8,
            0,
            Math.PI*2
        );


        ctx.fill();


        ctx.restore();

    }

}


/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    for(
        const p
        of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/45
            );


        ctx.fillStyle =
            "#ff5b22";


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    ctx.globalAlpha=1;

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(){

    document.getElementById(
        "levelText"
    ).innerText =
        level;


    document.getElementById(
        "scoreText"
    ).innerText =
        score;


    const hp =
        Math.max(
            0,
            hero.hp
        );


    document.getElementById(
        "heroHP"
    ).style.width =
        hp+"%";


    document.getElementById(
        "heroHP"
    ).style.background =
        hp<30
        ?
        "#ef4444"
        :
        "#22c55e";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        text;


    message.style.display =
        "block";


    setTimeout(
        function(){

            message.style.display =
                "none";

        },
        1700
    );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;

    boss=null;

    enemies=[];

    bullets=[];


    document.getElementById(
        "bossUI"
    ).style.display =
        "none";


    document.getElementById(
        "message"
    ).innerHTML =
        "💀 YOU DIED 💀"+
        "<br>"+
        "<small>SCORE: "+
        score+
        "</small>";


    document.getElementById(
        "message"
    ).style.display =
        "block";


    document.getElementById(
        "retry"
    ).style.display =
        "block";

}


/* =====================================================
   RETRY
===================================================== */

function retryGame(){

    document.getElementById(
        "message"
    ).style.display =
        "none";


    document.getElementById(
        "retry"
    ).style.display =
        "none";


    resetGame();

    running=true;

    startLevel();

    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   VICTORY
===================================================== */

function victory(){

    running=false;

    boss=null;


    document.getElementById(
        "bossUI"
    ).style.display =
        "none";


    document.getElementById(
        "message"
    ).innerHTML =
        "🏆 GHUMI GHUMI WINS 🏆"+
        "<br>"+
        "<small>ALL 10 LEVELS COMPLETED</small>"+
        "<br>"+
        "<small>SCORE: "+
        score+
        "</small>";


    document.getElementById(
        "message"
    ).style.display =
        "block";

}


/* =====================================================
   MAIN GAME LOOP
===================================================== */

function gameLoop(time){

    if(!running)
        return;


    let dt =
        (time-lastTime)/1000;


    lastTime=time;


    dt =
        Math.min(
            dt,
            .05
        );


    /*
        UPDATE
    */

    moveHero();

    updateLevel(dt);

    updateEnemies();

    updateBoss();

    updateBullets();

    updateParticles();


    /*
        DRAW
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();

    drawParticles();

    drawBullets();


    for(
        const enemy
        of enemies
    ){

        drawEnemy(enemy);

    }


    drawBoss();

    drawHero();

    updateUI();


    /*
        DEATH
    */

    if(
        hero.hp<=0
    ){

        hero.hp=0;

        updateUI();

        gameOver();

        return;

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   INITIAL
===================================================== */

updateUI();

</script>
