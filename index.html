<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallScore — QA Audit Desk</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --ink:#171B26;
  --paper:#F5F6FA;
  --card:#FFFFFF;
  --line:#E3E5EC;
  --teal:#0F9D8C;
  --indigo:#4C5FD5;
  --amber:#E29A2E;
  --coral:#E0574A;
  --muted:#6B7280;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

header{
  background:var(--ink);
  color:white;
}

.header{
  max-width:1200px;
  margin:auto;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:10px;
  background:var(--indigo);
  display:grid;
  place-items:center;
  font-size:20px;
}

.brand h2{
  margin:0;
  font-size:20px;
}

.brand small{
  color:#9CA3AF;
}

nav{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  background:#252B3B;
  padding:5px;
  border-radius:10px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#B9BEC9;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.nav-btn.active{
  background:#171B26;
  color:white;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:28px 20px 60px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
}

.grid{
  display:grid;
  gap:16px;
}

.stats{
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
}

.two{
  grid-template-columns:1.3fr 1fr;
}

@media(max-width:800px){
  .two{
    grid-template-columns:1fr;
  }
}

.stat{
  display:flex;
  align-items:center;
  gap:14px;
}

.stat-icon{
  width:42px;
  height:42px;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-size:19px;
}

.label{
  font-size:11px;
  color:var(--muted);
  font-weight:bold;
  text-transform:uppercase;
}

.value{
  font-size:23px;
  font-weight:bold;
}

.section{
  font-size:17px;
  font-weight:bold;
  margin-bottom:18px;
}

.input-label{
  display:block;
  font-size:12px;
  font-weight:bold;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:6px;
}

.input{
  width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
  background:white;
}

.input:focus{
  border-color:var(--indigo);
}

.number{
  width:100px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

.primary{
  border:0;
  background:var(--ink);
  color:white;
  padding:11px 16px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.secondary{
  border:1px solid var(--line);
  background:white;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.danger{
  border:1px solid #f1c5c0;
  background:#fff5f4;
  color:var(--coral);
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.success{
  color:var(--teal);
  font-weight:bold;
}

.score-row{
  margin-bottom:16px;
}

.score-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:7px;
}

.score-name{
  font-weight:bold;
  font-size:14px;
}

.score-input{
  display:flex;
  align-items:center;
  gap:8px;
}

.total-box{
  text-align:center;
}

.total-number{
  font-size:38px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  padding:5px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:bold;
  margin-top:8px;
}

.audit{
  margin-bottom:12px;
}

.audit-top{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#EEF0FF;
  color:var(--indigo);
  display:grid;
  place-items:center;
  font-weight:bold;
}

.audit-info{
  flex:1;
}

.audit-name{
  font-weight:bold;
}

.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.audit-detail{
  display:none;
  border-top:1px solid var(--line);
  margin-top:15px;
  padding-top:15px;
}

.audit-detail.open{
  display:block;
}

.bar{
  height:7px;
  background:var(--line);
  border-radius:5px;
  overflow:hidden;
  margin-top:4px;
}

.fill{
  height:100%;
  background:var(--indigo);
}

.agent-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.agent-row:last-child{
  border-bottom:0;
}

.agent-info{
  flex:1;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.login-card{
  width:min(400px,100%);
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:32px;
}

.role{
  width:100%;
  border:1px solid var(--line);
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  text-align:left;
  cursor:pointer;
  font-weight:bold;
}

.back{
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  margin-bottom:15px;
}

.notice{
  background:#EEF2FF;
  color:#3949A3;
  padding:11px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:15px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:60px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const PARAMETERS=[
  {key:"warmWelcome",label:"Warm Welcome",max:10},
  {key:"tone",label:"Tone & Communication / Active Listening",max:10},
  {key:"probing",label:"Requirement Probing & Call Control",max:10},
  {key:"serviceExplain",label:"Service Explain",max:20},
  {key:"usp",label:"USP Handling",max:15},
  {key:"urgency",label:"Urgency Creation",max:15},
  {key:"closing",label:"Closing Skills",max:10},
  {key:"followup",label:"Follow-up",max:10}
];

const MAX_TOTAL=100;
const ADMIN_PIN="1234";

let audits=[];
let agents={};
let role=null;
let currentAgent=null;
let tab="overview";

let currentScores={};

function saveData(){
  localStorage.setItem("callscore_audits",JSON.stringify(audits));
  localStorage.setItem("callscore_agents",JSON.stringify(agents));
}

function loadData(){
  try{
    audits=JSON.parse(localStorage.getItem("callscore_audits")||"[]");
  }catch{
    audits=[];
  }

  try{
    agents=JSON.parse(localStorage.getItem("callscore_agents")||"{}");
  }catch{
    agents={};
  }
}

function generatePIN(){
  return String(Math.floor(1000+Math.random()*9000));
}

function band(percent){

  if(percent>=90)
    return {name:"Excellent",color:"#0F9D8C"};

  if(percent>=75)
    return {name:"Good",color:"#4C5FD5"};

  if(percent>=60)
    return {name:"Average",color:"#E29A2E"};

  return {name:"Needs Improvement",color:"#E0574A"};
}

function initials(name){
  return name
    .split(" ")
    .map(x=>x[0])
    .slice(0,2)
    .join("")
    .toUpperCase();
}

function render(){

  if(!role){
    renderLogin();
    return;
  }

  renderShell();
}

function renderLogin(){

  document.getElementById("app").innerHTML=`

  <div class="login">

    <div class="login-card">

      <div style="text-align:center;margin-bottom:25px">

        <div class="logo" style="margin:auto">📋</div>

        <h2>CallScore</h2>

        <div style="color:#6B7280">
          QA Audit Desk
        </div>

      </div>

      <div id="loginBody">

        <div class="input-label">
          I am signing in as
        </div>

        <button class="role" id="adminLogin">
          🛡️ QA Admin / Auditor
        </button>

        <button class="role" id="agentLogin">
          🎧 Agent — View My Scores
        </button>

      </div>

    </div>

  </div>
  `;

  document.getElementById("adminLogin").onclick=showAdminLogin;
  document.getElementById("agentLogin").onclick=showAgentLogin;
}

function showAdminLogin(){

  document.getElementById("loginBody").innerHTML=`

    <button class="back" id="back">← Back</button>

    <label class="input-label">
      Admin PIN
    </label>

    <input
      id="adminPin"
      class="input"
      type="password"
      inputmode="numeric"
      maxlength="4"
      autocomplete="off"
      placeholder="Enter 4 digit PIN"
    >

    <div id="loginError"
         style="color:#E0574A;font-size:12px;margin:8px 0">
    </div>

    <button class="primary" id="loginBtn">
      Unlock Admin Dashboard
    </button>
  `;

  document.getElementById("back").onclick=renderLogin;

  const input=document.getElementById("adminPin");

  setTimeout(()=>{
    input.focus();
  },100);

  function login(){

    if(input.value===ADMIN_PIN){

      role="admin";
      tab="overview";

      render();

    }else{

      document.getElementById("loginError")
        .textContent="Incorrect PIN.";

    }

  }

  document.getElementById("loginBtn").onclick=login;

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      login();
    }
  });
}

function showAgentLogin(){

  const names=Object.keys(agents);

  document.getElementById("loginBody").innerHTML=`

    <button class="back" id="back">← Back</button>

    ${
      names.length
      ?
      `
      <label class="input-label">
        Your Name
      </label>

      <select id="agentName" class="input">
        ${names.map(n=>`
          <option value="${n}">
            ${n}
          </option>
        `).join("")}
      </select>

      `
      :
      `
      <div class="notice">
        No agents have been added yet.
      </div>
      `
    }

    <label class="input-label" style="margin-top:15px">
      Your PIN
    </label>

    <input
      id="agentPin"
      class="input"
      type="password"
      inputmode="numeric"
      maxlength="4"
      autocomplete="off"
      placeholder="Enter 4 digit PIN"
    >

    <div id="agentError"
         style="color:#E0574A;font-size:12px;margin:8px 0">
    </div>

    <button
      class="primary"
      id="agentLoginBtn"
      ${names.length?"":"disabled"}
    >
      View My Scores
    </button>
  `;

  document.getElementById("back").onclick=renderLogin;

  if(!names.length) return;

  const input=document.getElementById("agentPin");

  setTimeout(()=>{
    input.focus();
  },100);

  function login(){

    const name=document.getElementById("agentName").value;

    if(
      agents[name] &&
      input.value===agents[name].pin
    ){

      role="agent";
      currentAgent=name;
      tab="agent";

      render();

    }else{

      document.getElementById("agentError")
        .textContent="Incorrect PIN.";

    }

  }

  document.getElementById("agentLoginBtn").onclick=login;

  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      login();
    }
  });
}

function renderShell(){

  document.getElementById("app").innerHTML=`

  <header>

    <div class="header">

      <div class="brand">

        <div class="logo">📋</div>

        <div>
          <h2>CallScore</h2>
          <small>QA Audit Desk · 100-point scorecard</small>
        </div>

      </div>

      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">

        <nav id="nav"></nav>

        <button
          class="secondary"
          style="background:transparent;color:white;border-color:#444"
          id="logout"
        >
          Sign out
        </button>

      </div>

    </div>

  </header>

  <main class="container" id="content"></main>
  `;

  document.getElementById("logout").onclick=logout;

  renderNav();
  renderTab();
}

function renderNav(){

  const tabs=
    role==="admin"
    ?
    [
      ["overview","📊 Overview"],
      ["new","➕ New Audit"],
      ["all","📞 All Audits"],
      ["agents","👥 Manage Agents"]
    ]
    :
    [
      ["agent","👤 My Scores"]
    ];

  document.getElementById("nav").innerHTML=
    tabs.map(t=>`
      <button
        class="nav-btn ${tab===t[0]?"active":""}"
        data-tab="${t[0]}"
      >
        ${t[1]}
      </button>
    `).join("");

  document.querySelectorAll(".nav-btn").forEach(btn=>{

    btn.onclick=()=>{

      tab=btn.dataset.tab;

      renderTab();

    };

  });
}

function renderTab(){

  const c=document.getElementById("content");

  if(role==="admin"){

    if(tab==="overview")
      c.innerHTML=overview();

    if(tab==="new")
      c.innerHTML=newAudit();

    if(tab==="all")
      c.innerHTML=allAudits();

    if(tab==="agents")
      c.innerHTML=manageAgents();

    if(tab==="overview")
      overviewCharts();

    if(tab==="new")
      newAuditEvents();

    if(tab==="all")
      auditEvents();

    if(tab==="agents")
      agentEvents();

  }else{

    c.innerHTML=agentDashboard();

    agentCharts();

  }
}

function overview(){

  if(!audits.length){

    return `
      <div class="card empty">
        📋<br><br>
        No audits yet.<br>
        Go to <b>New Audit</b> to create one.
      </div>
    `;

  }

  const avg=
    audits.reduce((s,a)=>s+a.total,0)
    /audits.length;

  const b=band(avg);

  return `

    <div class="grid stats" style="margin-bottom:20px">

      ${stat("📞","Calls Audited",audits.length)}

      ${stat("👥","Agents",Object.keys(agents).length)}

      ${stat("📈","Team Average",avg.toFixed(1)+"%",b.color)}

    </div>

    <div class="grid two">

      <div class="card">

        <div class="section">
          Agent Leaderboard
        </div>

        <canvas id="leaderChart"></canvas>

      </div>

      <div class="card">

        <div class="section">
          Parameter Performance
        </div>

        <canvas id="radarChart"></canvas>

      </div>

    </div>
  `;
}

function stat(icon,label,value,color="#4C5FD5"){

  return `
    <div class="card stat">

      <div
        class="stat-icon"
        style="background:${color}18;color:${color}"
      >
        ${icon}
      </div>

      <div>

        <div class="label">
          ${label}
        </div>

        <div class="value">
          ${value}
        </div>

      </div>

    </div>
  `;
}

function overviewCharts(){

  if(!audits.length) return;

  const names=Object.keys(agents);

  const values=names.map(name=>{

    const list=audits.filter(a=>a.agentName===name);

    if(!list.length) return 0;

    return list.reduce((s,a)=>s+a.total,0)/list.length;

  });

  new Chart(
    document.getElementById("leaderChart"),
    {
      type:"bar",

      data:{
        labels:names,

        datasets:[
          {
            data:values,
            backgroundColor:"#4C5FD5"
          }
        ]
      },

      options:{
        plugins:{
          legend:{display:false}
        },

        scales:{
          y:{
            min:0,
            max:100
          }
        }
      }
    }
  );

  const parameterValues=
    PARAMETERS.map(p=>{

      const avg=
        audits.reduce(
          (s,a)=>s+a.scores[p.key],
          0
        )/audits.length;

      return avg/p.max*100;

    });

  new Chart(
    document.getElementById("radarChart"),
    {
      type:"radar",

      data:{
        labels:PARAMETERS.map(p=>p.label),

        datasets:[
          {
            data:parameterValues,
            borderColor:"#4C5FD5",
            backgroundColor:"#4C5FD555"
          }
        ]
      },

      options:{
        scales:{
          r:{
            min:0,
            max:100
          }
        },

        plugins:{
          legend:{display:false}
        }
      }
    }
  );
}

function newAudit(){

  currentScores={};

  PARAMETERS.forEach(p=>{
    currentScores[p.key]=Math.round(p.max*.7);
  });

  const total=
    PARAMETERS.reduce(
      (s,p)=>s+currentScores[p.key],
      0
    );

  const b=band(total);

  return `

  <form id="auditForm" class="card">

    <div class="grid two">

      <div>

        <div class="section">
          Score a Call
        </div>

        <div class="grid" style="grid-template-columns:1fr 1fr">

          <div>

            <label class="input-label">
              Agent Name
            </label>

            <input
              id="auditAgent"
              class="input"
              list="agentList"
              required
            >

            <datalist id="agentList">

              ${Object.keys(agents).map(n=>`
                <option value="${n}">
              `).join("")}

            </datalist>

          </div>

          <div>

            <label class="input-label">
              Auditor Name
            </label>

            <input
              id="auditor"
              class="input"
              required
            >

          </div>

          <div>

            <label class="input-label">
              Call ID
            </label>

            <input
              id="callId"
              class="input"
            >

          </div>

          <div>

            <label class="input-label">
              Call Date
            </label>

            <input
              id="callDate"
              type="date"
              class="input"
              value="${new Date().toISOString().slice(0,10)}"
            >

          </div>

        </div>

        <div style="margin-top:22px">

          ${PARAMETERS.map(p=>`

            <div class="score-row">

              <div class="score-head">

                <span class="score-name">
                  ${p.label}
                </span>

                <div class="score-input">

                  <input
                    class="number score"
                    type="number"
                    min="0"
                    max="${p.max}"
                    value="${currentScores[p.key]}"
                    data-key="${p.key}"
                    data-max="${p.max}"
                  >

                  <span>
                    / ${p.max}
                  </span>

                </div>

              </div>

            </div>

          `).join("")}

        </div>

        <label class="input-label">
          Remarks / Coaching Notes
        </label>

        <textarea
          id="remarks"
          class="input"
          rows="4"
          placeholder="Observations, feedback, coaching notes..."
        ></textarea>

      </div>

      <div class="card total-box"
           style="align-self:start">

        <div class="label">
          Total Score
        </div>

        <div
          id="total"
          class="total-number"
        >
          ${total}
        </div>

        <div>
          / 100
        </div>

        <div
          id="badge"
          class="badge"
          style="
            color:${b.color};
            background:${b.color}18
          "
        >
          ${b.name}
        </div>

        <button
          class="primary"
          style="width:100%;margin-top:20px"
          type="submit"
        >
          Save Evaluation
        </button>

        <div
          id="saveMessage"
          class="success"
          style="margin-top:10px"
        ></div>

      </div>

    </div>

  </form>
  `;
}

function newAuditEvents(){

  document.querySelectorAll(".score").forEach(input=>{

    input.addEventListener("input",()=>{

      let value=Number(input.value);

      const max=Number(input.dataset.max);

      if(value<0) value=0;

      if(value>max) value=max;

      if(Number.isNaN(value))
        value=0;

      input.value=value;

      currentScores[input.dataset.key]=value;

      updateTotal();

    });

  });

  document.getElementById("auditForm").onsubmit=e=>{

    e.preventDefault();

    const agentName=
      document.getElementById("auditAgent")
      .value.trim();

    const auditorName=
      document.getElementById("auditor")
      .value.trim();

    if(!agentName||!auditorName)
      return;

    const total=
      PARAMETERS.reduce(
        (s,p)=>s+currentScores[p.key],
        0
      );

    const record={

      id:Date.now(),

      agentName,

      auditorName,

      callId:
        document.getElementById("callId")
        .value.trim() || "—",

      date:
        document.getElementById("callDate")
        .value,

      scores:{
        ...currentScores
      },

      remarks:
        document.getElementById("remarks")
        .value.trim(),

      total,

      createdAt:Date.now()

    };

    audits.unshift(record);

    if(!agents[agentName]){

      agents[agentName]={
        pin:generatePIN()
      };

      alert(
        `New agent added automatically.\n\nAgent: ${agentName}\nPIN: ${agents[agentName].pin}`
      );

    }

    saveData();

    document.getElementById("saveMessage")
      .textContent="✓ Evaluation saved.";

  };
}

function updateTotal(){

  const total=
    PARAMETERS.reduce(
      (s,p)=>s+Number(currentScores[p.key]||0),
      0
    );

  const b=band(total);

  document.getElementById("total")
    .textContent=total;

  const badge=
    document.getElementById("badge");

  badge.textContent=b.name;

  badge.style.color=b.color;

  badge.style.background=b.color+"18";
}

function allAudits(){

  if(!audits.length){

    return `
      <div class="card empty">
        No evaluations yet.
      </div>
    `;

  }

  return `

    <div class="card">

      <div class="section">
        All Evaluations
      </div>

      <input
        id="search"
        class="input"
        placeholder="Search agent or call ID..."
        style="margin-bottom:16px"
      >

      <div id="auditList"></div>

    </div>
  `;
}

function auditEvents(){

  renderAuditList();

  document.getElementById("search")
    .oninput=renderAuditList;

}

function renderAuditList(){

  const search=
    document.getElementById("search")
    ?.value.toLowerCase() || "";

  const list=
    audits.filter(a=>
      a.agentName.toLowerCase().includes(search) ||
      a.callId.toLowerCase().includes(search)
    );

  document.getElementById("auditList").innerHTML=
    list.map(a=>{

      const percent=a.total;

      const b=band(percent);

      return `

      <div class="card audit">

        <div
          class="audit-top"
          data-id="${a.id}"
        >

          <div class="avatar">
            ${initials(a.agentName)}
          </div>

          <div class="audit-info">

            <div class="audit-name">
              ${a.agentName}
            </div>

            <div class="meta">
              ${a.date}
              · Call ${a.callId}
              · Auditor: ${a.auditorName}
            </div>

          </div>

          <span
            class="badge"
            style="
              color:${b.color};
              background:${b.color}18
            "
          >
            ${a.total}%
          </span>

          <button
            class="danger deleteAudit"
            data-id="${a.id}"
          >
            Delete
          </button>

        </div>

        <div
          class="audit-detail"
          id="detail-${a.id}"
        >

          ${PARAMETERS.map(p=>`

            <div style="margin-bottom:10px">

              <div style="
                display:flex;
                justify-content:space-between;
                font-size:12px
              ">

                <span>
                  ${p.label}
                </span>

                <b>
                  ${a.scores[p.key]} / ${p.max}
                </b>

              </div>

              <div class="bar">

                <div
                  class="fill"
                  style="
                    width:${a.scores[p.key]/p.max*100}%
                  "
                ></div>

              </div>

            </div>

          `).join("")}

          ${
            a.remarks
            ?
            `
            <div class="notice">
              <b>Remarks:</b>
              ${a.remarks}
            </div>
            `
            :
            ""
          }

        </div>

      </div>
      `;

    }).join("");

  document.querySelectorAll(".audit-top").forEach(row=>{

    row.onclick=e=>{

      if(e.target.classList.contains("deleteAudit"))
        return;

      const id=row.dataset.id;

      document
        .getElementById("detail-"+id)
        .classList.toggle("open");

    };

  });

  document.querySelectorAll(".deleteAudit").forEach(btn=>{

    btn.onclick=()=>{

      const id=Number(btn.dataset.id);

      if(
        confirm(
          "Delete this evaluation?"
        )
      ){

        audits=
          audits.filter(a=>a.id!==id);

        saveData();

        renderAuditList();

      }

    };

  });
}

function manageAgents(){

  const names=Object.keys(agents);

  return `

    <div class="grid two">

      <div class="card">

        <div class="section">
          Manage Agents
        </div>

        <div id="agentsList">

          ${
            names.length
            ?
            names.map(name=>`

              <div class="agent-row">

                <div class="avatar">
                  ${initials(name)}
                </div>

                <div class="agent-info">

                  <b>
                    ${name}
                  </b>

                  <div class="meta">
                    PIN: ${agents[name].pin}
                  </div>

                </div>

                <div class="actions">

                  <button
                    class="secondary editAgent"
                    data-name="${name}"
                  >
                    ✏️ Edit
                  </button>

                  <button
                    class="secondary regenPin"
                    data-name="${name}"
                  >
                    🔄 PIN
                  </button>

                  <button
                    class="danger deleteAgent"
                    data-name="${name}"
                  >
                    🗑️ Delete
                  </button>

                </div>

              </div>

            `).join("")
            :
            `
            <div class="empty">
              No agents added yet.
            </div>
            `
          }

        </div>

      </div>

      <div class="card">

        <div class="section">
          Add New Agent
        </div>

        <label class="input-label">
          Agent Name
        </label>

        <input
          id="newAgent"
          class="input"
          placeholder="Enter agent name"
        >

        <button
          id="addAgent"
          class="primary"
          style="margin-top:12px"
        >
          Add Agent & Generate PIN
        </button>

        <div
          id="agentMessage"
          class="success"
          style="margin-top:12px"
        ></div>

      </div>

    </div>
  `;
}

function agentEvents(){

  document.getElementById("addAgent").onclick=()=>{

    const input=document.getElementById("newAgent");

    const name=input.value.trim();

    if(!name)
      return;

    if(agents[name]){

      alert("This agent already exists.");

      return;

    }

    agents[name]={
      pin:generatePIN()
    };

    saveData();

    alert(
      `Agent added successfully.\n\nName: ${name}\nPIN: ${agents[name].pin}`
    );

    renderTab();

  };

  document.querySelectorAll(".editAgent")
    .forEach(btn=>{

      btn.onclick=()=>{

        const oldName=btn.dataset.name;

        const newName=
          prompt(
            "Enter new agent name:",
            oldName
          );

        if(
          !newName ||
          newName.trim()===oldName
        )
          return;

        const clean=newName.trim();

        if(agents[clean]){

          alert(
            "An agent with this name already exists."
          );

          return;

        }

        agents[clean]=agents[oldName];

        delete agents[oldName];

        /*
          Rename the agent in existing evaluations
          so the history is preserved.
        */

        audits.forEach(a=>{

          if(a.agentName===oldName){

            a.agentName=clean;

          }

        });

        saveData();

        renderTab();

      };

    });

  document.querySelectorAll(".regenPin")
    .forEach(btn=>{

      btn.onclick=()=>{

        const name=btn.dataset.name;

        agents[name].pin=generatePIN();

        saveData();

        alert(
          `New PIN for ${name}:\n\n${agents[name].pin}`
        );

        renderTab();

      };

    });

  document.querySelectorAll(".deleteAgent")
    .forEach(btn=>{

      btn.onclick=()=>{

        const name=btn.dataset.name;

        const confirmDelete=
          confirm(
            `Delete ${name}?\n\nTheir old evaluations will NOT be deleted.`
          );

        if(!confirmDelete)
          return;

        delete agents[name];

        /*
          IMPORTANT:
          Evaluations remain in the system.
          Only the agent login/PIN is removed.
        */

        saveData();

        renderTab();

      };

    });
}

function agentDashboard(){

  const list=
    audits
      .filter(a=>a.agentName===currentAgent)
      .sort((a,b)=>a.createdAt-b.createdAt);

  if(!list.length){

    return `

      <div class="card empty">

        No evaluations have been assigned to you yet.

      </div>

    `;

  }

  const avg=
    list.reduce((s,a)=>s+a.total,0)
    /list.length;

  const b=band(avg);

  return `

    <div class="grid stats" style="margin-bottom:20px">

      ${stat(
        "📞",
        "Calls Audited",
        list.length
      )}

      ${stat(
        "📈",
        "Average Score",
        avg.toFixed(1)+"%",
        b.color
      )}

      ${stat(
        "📋",
        "Latest Score",
        list[list.length-1].total+"%"
      )}

    </div>

    <div class="grid two">

      <div class="card">

        <div class="section">
          Score Trend
        </div>

        <canvas id="trendChart"></canvas>

      </div>

      <div class="card">

        <div class="section">
          Strengths & Gaps
        </div>

        <canvas id="agentRadar"></canvas>

      </div>

    </div>

    <div
      class="section"
      style="margin-top:25px"
    >
      My Evaluation History
    </div>

    ${[...list].reverse().map(a=>`

      <div class="card audit">

        <div class="audit-top">

          <div class="avatar">
            ${initials(currentAgent)}
          </div>

          <div class="audit-info">

            <div class="audit-name">
              Call ${a.callId}
            </div>

            <div class="meta">
              ${a.date}
              · Audited by ${a.auditorName}
            </div>

          </div>

          <span class="badge"
            style="
              color:${band(a.total).color};
              background:${band(a.total).color}18
            "
          >
            ${a.total}%
          </span>

        </div>

        ${
          a.remarks
          ?
          `
          <div
            class="notice"
            style="margin-top:12px"
          >
            ${a.remarks}
          </div>
          `
          :
          ""
        }

      </div>

    `).join("")}
  `;
}

function agentCharts(){

  const list=
    audits
      .filter(a=>a.agentName===currentAgent)
      .sort((a,b)=>a.createdAt-b.createdAt);

  if(!list.length)
    return;

  new Chart(
    document.getElementById("trendChart"),
    {
      type:"line",

      data:{
        labels:list.map((_,i)=>"Call "+(i+1)),

        datasets:[
          {
            data:list.map(a=>a.total),
            borderColor:"#4C5FD5",
            backgroundColor:"#4C5FD5",
            tension:.3
          }
        ]
      },

      options:{
        plugins:{
          legend:{display:false}
        },

        scales:{
          y:{
            min:0,
            max:100
          }
        }
      }
    }
  );

  const values=
    PARAMETERS.map(p=>
      list.reduce(
        (s,a)=>s+a.scores[p.key],
        0
      )/list.length/p.max*100
    );

  new Chart(
    document.getElementById("agentRadar"),
    {
      type:"radar",

      data:{
        labels:PARAMETERS.map(p=>p.label),

        datasets:[
          {
            data:values,
            borderColor:"#0F9D8C",
            backgroundColor:"#0F9D8C55"
          }
        ]
      },

      options:{
        scales:{
          r:{
            min:0,
            max:100
          }
        },

        plugins:{
          legend:{display:false}
        }
      }
    }
  );
}

function logout(){

  role=null;
  currentAgent=null;
  tab="overview";

  render();

}

loadData();

render();

</script>
