<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallScore — QA Audit Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#171B26; --paper:#F5F6FA; --card:#FFFFFF; --line:#E3E5EC;
    --teal:#0F9D8C; --indigo:#4C5FD5; --amber:#E29A2E; --coral:#E0574A; --muted:#6B7280;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  input,textarea,select,button{font-family:'Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  header{background:var(--ink);border-bottom:1px solid var(--line);}
  .header-inner{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-icon{width:38px;height:38px;border-radius:10px;background:var(--indigo);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;}
  .brand-name{font-weight:700;font-size:19px;color:white;line-height:1.1;}
  .brand-sub{font-size:11.5px;color:#9CA3AF;}
  nav{display:flex;gap:6px;background:#232A3B;padding:5px;border-radius:12px;flex-wrap:wrap;align-items:center;}
  .tabbtn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;background:transparent;color:#B9BEC9;}
  .tabbtn.active{background:var(--ink);color:white;}
  .who{display:flex;align-items:center;gap:10px;color:#B9BEC9;font-size:13px;}
  .logout-btn{background:none;border:1px solid #3A4256;color:#B9BEC9;padding:7px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;}
  .grid{display:grid;gap:16px;}
  .grid-stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .grid-2{grid-template-columns:1.3fr 1fr;gap:18px;}
  @media (max-width:800px){.grid-2{grid-template-columns:1fr;}}

  .stat-card{padding:16px 18px;display:flex;align-items:center;gap:14px;}
  .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
  .stat-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
  .stat-value{font-size:22px;font-weight:600;}

  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:16px;}
  .field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:block;}
  .text-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);font-size:14px;outline:none;background:white;}
  .text-input:focus{border-color:var(--indigo);}

  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--indigo);cursor:pointer;border:2px solid white;box-shadow:0 0 0 1px var(--indigo);}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--indigo);cursor:pointer;border:2px solid white;}

  .stub-divider{position:relative;width:1px;align-self:stretch;border-left:1.5px dashed var(--line);margin:0 18px;}
  .stub-divider::before,.stub-divider::after{content:'';position:absolute;left:-8px;width:16px;height:16px;border-radius:50%;background:var(--paper);}
  .stub-divider::before{top:-8px;} .stub-divider::after{bottom:-8px;}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;}
  .badge-dot{width:6px;height:6px;border-radius:50%;}

  .btn-primary{padding:11px 0;border-radius:10px;border:none;background:var(--ink);color:white;font-weight:600;font-size:13.5px;cursor:pointer;width:100%;}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-ghost{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:white;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;}

  .empty{padding:60px;text-align:center;color:var(--muted);}
  .error-text{color:var(--coral);font-size:12.5px;margin-top:8px;min-height:16px;}

  .audit-row{padding:16px 20px;display:flex;flex-direction:column;gap:0;}
  .audit-row-top{display:flex;align-items:center;}
  .audit-click{flex:1;display:flex;align-items:center;gap:16px;cursor:pointer;min-width:0;}
  .avatar{width:34px;height:34px;border-radius:50%;background:rgba(76,95,213,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--indigo);font-weight:700;}
  .audit-name{font-weight:600;font-size:14.5px;}
  .audit-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap;}
  .audit-detail{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:none;}
  .audit-detail.open{display:block;}
  .param-bar-track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .param-bar-fill{height:100%;background:var(--indigo);}
  .remarks-box{margin-top:14px;font-size:13px;background:var(--paper);padding:12px;border-radius:8px;}

  .agent-history-card{padding:14px 20px;display:flex;align-items:center;}

  /* Login screen */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;}
  .role-btn{width:100%;padding:16px;border-radius:12px;border:1.5px solid var(--line);background:white;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;margin-bottom:10px;text-align:left;}
  .role-btn:hover{border-color:var(--indigo);}
  .pin-input{letter-spacing:6px;font-size:20px;text-align:center;font-family:'IBM Plex Mono',monospace;}
  .back-link{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;margin-bottom:14px;padding:0;}

  .pin-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
  .pin-row:last-child{border-bottom:none;}
</style>
</head>
<body>

<div id="app"></div>

<script>
const PARAMETERS = [
  { key:"warmWelcome", label:"Warm Welcome", max:10 },
  { key:"tone", label:"Tone & Communication / Active Listening", max:10 },
  { key:"probing", label:"Requirement Probing & Call Control", max:10 },
  { key:"serviceExplain", label:"Service Explain", max:20 },
  { key:"usp", label:"USP Handling", max:15 },
  { key:"urgency", label:"Urgency Creation", max:15 },
  { key:"closing", label:"Closing Skills", max:10 },
  { key:"followup", label:"Follow-up", max:10 },
];
const MAX_TOTAL = PARAMETERS.reduce((s,p)=>s+p.max,0);
const COLORS = { ink:"#171B26", paper:"#F5F6FA", card:"#FFFFFF", line:"#E3E5EC", teal:"#0F9D8C", indigo:"#4C5FD5", amber:"#E29A2E", coral:"#E0574A", muted:"#6B7280" };
const DEFAULT_ADMIN_PIN = "1234";

function band(pct){
  if(pct>=90) return {label:"Excellent", color:COLORS.teal};
  if(pct>=75) return {label:"Good", color:COLORS.indigo};
  if(pct>=60) return {label:"Average", color:COLORS.amber};
  return {label:"Needs Improvement", color:COLORS.coral};
}
function uid(){ return "aud_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genPin(){ return String(Math.floor(1000+Math.random()*9000)); }

function badgeHTML(b){
  return `<span class="badge" style="color:${b.color};background:${b.color}18;"><span class="badge-dot" style="background:${b.color};"></span>${b.label}</span>`;
}
function ringSVG(pct,size,stroke,color,id){
  const r=(size-stroke)/2, c=2*Math.PI*r, offset=c-(Math.min(pct,100)/100)*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${COLORS.line}" stroke-width="${stroke}"/>
    <circle id="${id||''}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round" style="transition:stroke-dashoffset .4s ease"/>
    <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" transform="rotate(90 ${size/2} ${size/2})"
      style="font-family:'IBM Plex Mono',monospace;font-size:${size*0.28}px;font-weight:600;fill:${COLORS.ink};">${Math.round(pct)}</text>
  </svg>`;
}
function statCard(icon,label,value,accent){
  return `<div class="card stat-card">
    <div class="stat-icon" style="background:${(accent||COLORS.indigo)}18;color:${accent||COLORS.indigo}">${icon}</div>
    <div><div class="stat-label">${label}</div><div class="stat-value mono">${value}</div></div>
  </div>`;
}

/* ---------------- State & storage ---------------- */
let audits = [];
let agentPins = {};      // { agentName: "1234" }
let adminPin = DEFAULT_ADMIN_PIN;
let role = null;         // null | "admin" | "agent"
let currentAgentName = null;
let tab = "overview";
let charts = {};

async function loadAll(){
  try{ const r = await window.storage.get("qa_audits", true); audits = r ? JSON.parse(r.value) : []; }catch(e){ audits = []; }
  try{ const r = await window.storage.get("qa_agent_pins", true); agentPins = r ? JSON.parse(r.value) : {}; }catch(e){ agentPins = {}; }
  try{ const r = await window.storage.get("qa_admin_pin", true); adminPin = r ? JSON.parse(r.value) : DEFAULT_ADMIN_PIN; }
  catch(e){
    adminPin = DEFAULT_ADMIN_PIN;
    try{ await window.storage.set("qa_admin_pin", JSON.stringify(DEFAULT_ADMIN_PIN), true); }catch(e2){}
  }
}
async function persistAudits(next){
  audits = next;
  try{ await window.storage.set("qa_audits", JSON.stringify(next), true); }catch(e){ alert("Could not save. Please retry."); }
}
async function persistAgentPins(next){
  agentPins = next;
  try{ await window.storage.set("qa_agent_pins", JSON.stringify(next), true); }catch(e){ alert("Could not save PINs. Please retry."); }
}
async function persistAdminPin(next){
  adminPin = next;
  try{ await window.storage.set("qa_admin_pin", JSON.stringify(next), true); }catch(e){ alert("Could not save PIN. Please retry."); }
}
function agentNames(){
  return Array.from(new Set([...audits.map(a=>a.agentName), ...Object.keys(agentPins)])).sort();
}
function destroyCharts(){ Object.values(charts).forEach(c=>c && c.destroy()); charts = {}; }

/* ---------------- Login screens ---------------- */
function renderApp(){
  destroyCharts();
  const app = document.getElementById("app");
  if(!role){ app.innerHTML = loginChooserHTML(); wireLoginChooser(); return; }
  app.innerHTML = shellHTML();
  wireShell();
}

function loginChooserHTML(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand" style="margin-bottom:22px;justify-content:center;">
        <div class="brand-icon">📋</div>
        <div><div class="brand-name" style="color:var(--ink);">CallScore</div><div class="brand-sub" style="color:var(--muted);">QA Audit Desk</div></div>
      </div>
      <div id="login-body">
        <div class="field-label">I am signing in as</div>
        <button class="role-btn" id="pick-admin">🛡️ &nbsp; QA Admin / Auditor</button>
        <button class="role-btn" id="pick-agent">🎧 &nbsp; Agent — view my scores</button>
      </div>
    </div>
  </div>`;
}
function wireLoginChooser(){
  document.getElementById("pick-admin").addEventListener("click", showAdminLogin);
  document.getElementById("pick-agent").addEventListener("click", showAgentLogin);
}
function showAdminLogin(){
  document.getElementById("login-body").innerHTML = `
    <button class="back-link" id="back-btn">← back</button>
    <div class="field-label">Admin PIN</div>
    <input class="text-input pin-input" id="admin-pin-input" maxlength="4" inputmode="numeric" placeholder="••••">
    <div class="error-text" id="admin-err"></div>
    <button class="btn-primary" id="admin-submit" style="margin-top:6px;">Unlock Admin Dashboard</button>
  `;
  document.getElementById("back-btn").addEventListener("click", renderApp);
  const input = document.getElementById("admin-pin-input");
  input.focus();
  function tryLogin(){
    if(input.value.trim() === String(adminPin)){ role = "admin"; tab = "overview"; renderApp(); }
    else document.getElementById("admin-err").textContent = "Incorrect PIN. Try again.";
  }
  document.getElementById("admin-submit").addEventListener("click", tryLogin);
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
}
function showAgentLogin(){
  const names = agentNames();
  document.getElementById("login-body").innerHTML = `
    <button class="back-link" id="back-btn">← back</button>
    <div class="field-label">Your Name</div>
    ${names.length ? `
      <select class="text-input" id="agent-name-input" style="margin-bottom:14px;">
        ${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("")}
      </select>` : `<div style="font-size:13px;color:var(--muted);margin-bottom:14px;">No agents have been set up yet — ask your QA admin to add you.</div>`}
    <div class="field-label">Your PIN</div>
    <input class="text-input pin-input" id="agent-pin-input" maxlength="4" inputmode="numeric" placeholder="••••">
    <div class="error-text" id="agent-err"></div>
    <button class="btn-primary" id="agent-submit" style="margin-top:6px;" ${names.length?"":"disabled"}>View My Scores</button>
  `;
  document.getElementById("back-btn").addEventListener("click", renderApp);
  if(!names.length) return;
  const pinInput = document.getElementById("agent-pin-input");
  function tryLogin(){
    const name = document.getElementById("agent-name-input").value;
    if(agentPins[name] && pinInput.value.trim() === String(agentPins[name])){
      role = "agent"; currentAgentName = name; tab = "agent"; renderApp();
    } else {
      document.getElementById("agent-err").textContent = "Incorrect PIN for this name. Check with your QA admin.";
    }
  }
  document.getElementById("agent-submit").addEventListener("click", tryLogin);
  pinInput.addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
}
function logout(){ role = null; currentAgentName = null; renderApp(); }

/* ---------------- Shell (header + tabs) ---------------- */
function shellHTML(){
  return `
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">📋</div>
        <div><div class="brand-name">CallScore</div><div class="brand-sub">QA Audit Desk · 100-point scorecard</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <nav id="nav"></nav>
        <div class="who">
          ${role==="admin" ? "🛡️ Admin" : "🎧 " + esc(currentAgentName)}
          <button class="logout-btn" id="logout-btn">Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <div class="wrap" id="content"></div>`;
}
function wireShell(){
  document.getElementById("logout-btn").addEventListener("click", logout);
  renderNav();
  renderTabContent();
}
function renderNav(){
  const adminTabs = [
    {id:"overview", label:"Overview", icon:"📊"},
    {id:"new", label:"New Audit", icon:"➕"},
    {id:"all", label:"All Audits", icon:"📞"},
    {id:"pins", label:"Manage PINs", icon:"🔑"},
  ];
  const agentTabs = [{id:"agent", label:"My Scores", icon:"👤"}];
  const tabs = role === "admin" ? adminTabs : agentTabs;
  document.getElementById("nav").innerHTML = tabs.map(t=>
    `<button class="tabbtn ${tab===t.id?'active':''}" data-tab="${t.id}">${t.icon} ${t.label}</button>`
  ).join("");
  document.querySelectorAll(".tabbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ tab = btn.dataset.tab; renderTabContent(); });
  });
}
function renderTabContent(){
  destroyCharts();
  renderNav();
  const c = document.getElementById("content");
  if(role === "admin"){
    c.innerHTML = tab==="overview" ? overviewHTML() : tab==="new" ? newAuditHTML() : tab==="all" ? allAuditsHTML() : pinsHTML();
    if(tab==="overview") wireOverview();
    if(tab==="new") wireNewAudit();
    if(tab==="all") wireAllAudits();
    if(tab==="pins") wirePins();
  } else {
    c.innerHTML = `<div id="agent-content"></div>`;
    renderAgentContent();
  }
}

/* ---------------- Overview ---------------- */
function overviewHTML(){
  if(audits.length===0) return `<div class="card empty">📋<br><br>No audits logged yet. Head to “New Audit” to score your first call.</div>`;
  const totals = audits.map(a=>a.total);
  const teamAvgPct = (totals.reduce((s,t)=>s+t,0)/totals.length/MAX_TOTAL)*100;
  const ob = band(teamAvgPct);
  return `
    <div class="grid grid-stats" style="margin-bottom:24px;">
      ${statCard("📞","Calls Audited",audits.length)}
      ${statCard("👥","Agents Covered",agentNames().length)}
      ${statCard("📈","Team Average",teamAvgPct.toFixed(1)+"%",ob.color)}
    </div>
    <div class="grid grid-2">
      <div class="card" style="padding:20px;">
        <div class="section-title">Agent Leaderboard</div>
        <canvas id="chart-leaderboard" height="${Math.max(220, agentNames().length*42)}"></canvas>
      </div>
      <div class="card" style="padding:20px;">
        <div class="section-title">Team Strength by Parameter</div>
        <canvas id="chart-teamradar" height="260"></canvas>
      </div>
    </div>`;
}
function wireOverview(){
  if(audits.length===0) return;
  const names = agentNames();
  const perAgent = names.map(name=>{
    const list = audits.filter(a=>a.agentName===name);
    if(!list.length) return null;
    const avg = list.reduce((s,a)=>s+a.total,0)/list.length;
    return { name, avgPct: (avg/MAX_TOTAL)*100 };
  }).filter(Boolean).sort((a,b)=>b.avgPct-a.avgPct);

  charts.leaderboard = new Chart(document.getElementById("chart-leaderboard"), {
    type:"bar",
    data:{ labels: perAgent.map(a=>a.name), datasets:[{ data: perAgent.map(a=>a.avgPct), backgroundColor: perAgent.map(a=>band(a.avgPct).color), borderRadius:6 }] },
    options:{ indexAxis:"y", plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.x.toFixed(1)+"%"}}}, scales:{x:{min:0,max:100,grid:{color:COLORS.line}}, y:{grid:{display:false}}} }
  });

  const perParam = PARAMETERS.map(p=>{
    const avg = audits.reduce((s,a)=>s+a.scores[p.key],0)/audits.length;
    return { label: p.label.split(" / ")[0].split(" & ")[0], value: Number(((avg/p.max)*100).toFixed(1)) };
  });
  charts.teamradar = new Chart(document.getElementById("chart-teamradar"), {
    type:"radar",
    data:{ labels: perParam.map(p=>p.label), datasets:[{ data: perParam.map(p=>p.value), borderColor:COLORS.indigo, backgroundColor:COLORS.indigo+"55", pointBackgroundColor:COLORS.indigo }] },
    options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.r+"%"}}}, scales:{ r:{ min:0, max:100, ticks:{display:false}, grid:{color:COLORS.line}, angleLines:{color:COLORS.line}, pointLabels:{font:{size:10.5}, color:COLORS.muted} } } }
  });
}

/* ---------------- New Audit ---------------- */
function defaultScores(){ return Object.fromEntries(PARAMETERS.map(p=>[p.key, Math.round(p.max*0.7)])); }
let currentScores = defaultScores();

function newAuditHTML(){
  currentScores = defaultScores();
  const total = PARAMETERS.reduce((s,p)=>s+currentScores[p.key],0);
  const pct = (total/MAX_TOTAL)*100;
  const b = band(pct);
  return `
  <form id="audit-form" class="card" style="padding:26px;display:flex;gap:8px;">
    <div style="flex:1;min-width:0;">
      <div class="section-title">Score a Call</div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">
        <div><label class="field-label">Agent Name</label>
          <input class="text-input" list="agent-list" id="f-agent" placeholder="e.g. Priya Sharma" required>
          <datalist id="agent-list">${agentNames().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
          <div style="font-size:11.5px;color:${COLORS.muted};margin-top:5px;">New name? A PIN will be auto-generated so they can view their scores.</div>
        </div>
        <div><label class="field-label">Auditor Name</label><input class="text-input" id="f-auditor" placeholder="Your name" required></div>
        <div><label class="field-label">Call ID / Reference</label><input class="text-input" id="f-callid" placeholder="e.g. CL-10234"></div>
        <div><label class="field-label">Call Date</label><input type="date" class="text-input" id="f-date" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        ${PARAMETERS.map(p=>`
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <label style="font-size:13.5px;font-weight:600;">${p.label}</label>
              <span class="mono" id="val-${p.key}" style="font-size:13px;color:${COLORS.muted};">${currentScores[p.key]} / ${p.max}</span>
            </div>
            <input type="range" min="0" max="${p.max}" value="${currentScores[p.key]}" data-key="${p.key}" data-max="${p.max}" class="score-slider">
          </div>`).join("")}
      </div>
      <div style="margin-top:20px;">
        <label class="field-label">Remarks / Coaching Notes</label>
        <textarea class="text-input" id="f-remarks" rows="3" placeholder="Observations, what went well, what to improve…"></textarea>
      </div>
    </div>
    <div class="stub-divider"></div>
    <div style="width:190px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-top:10px;">
      <div class="field-label" style="margin:0;">Total Score</div>
      <div id="ring-wrap">${ringSVG(pct,110,9,b.color,"main-ring")}</div>
      <div class="mono" id="total-fraction" style="font-size:13px;color:${COLORS.muted};">${total} / ${MAX_TOTAL}</div>
      <div id="badge-wrap">${badgeHTML(b)}</div>
      <button type="submit" class="btn-primary" id="save-btn" style="margin-top:10px;">Save Audit</button>
      <div id="saved-msg" class="mono" style="font-size:11.5px;color:${COLORS.teal};font-weight:600;display:none;text-align:center;"></div>
    </div>
  </form>`;
}
function wireNewAudit(){
  document.querySelectorAll(".score-slider").forEach(slider=>{
    slider.addEventListener("input", e=>{
      const key = e.target.dataset.key, max = Number(e.target.dataset.max);
      currentScores[key] = Number(e.target.value);
      document.getElementById("val-"+key).textContent = `${currentScores[key]} / ${max}`;
      const total = PARAMETERS.reduce((s,p)=>s+currentScores[p.key],0);
      const pct = (total/MAX_TOTAL)*100, b = band(pct);
      document.getElementById("ring-wrap").innerHTML = ringSVG(pct,110,9,b.color,"main-ring");
      document.getElementById("total-fraction").textContent = `${total} / ${MAX_TOTAL}`;
      document.getElementById("badge-wrap").innerHTML = badgeHTML(b);
    });
  });
  document.getElementById("audit-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const agentName = document.getElementById("f-agent").value.trim();
    const auditorName = document.getElementById("f-auditor").value.trim();
    if(!agentName || !auditorName) return;
    const btn = document.getElementById("save-btn");
    btn.disabled = true; btn.textContent = "Saving…";
    const total = PARAMETERS.reduce((s,p)=>s+currentScores[p.key],0);
    const record = {
      id: uid(), agentName, auditorName,
      callId: document.getElementById("f-callid").value.trim() || "—",
      date: document.getElementById("f-date").value,
      scores: {...currentScores},
      remarks: document.getElementById("f-remarks").value.trim(),
      total, createdAt: Date.now()
    };
    await persistAudits([record, ...audits]);
    let newPinMsg = "";
    if(!agentPins[agentName]){
      const pin = genPin();
      await persistAgentPins({...agentPins, [agentName]: pin});
      newPinMsg = ` New agent PIN for ${agentName}: ${pin} — share this with them.`;
    }
    tab = "new"; renderTabContent();
    const m = document.getElementById("saved-msg");
    m.style.display = "block";
    m.textContent = "✓ Saved." + newPinMsg;
  });
}

/* ---------------- All Audits ---------------- */
function allAuditsHTML(){
  if(audits.length===0) return `<div class="card empty">No audits logged yet.</div>`;
  return `
    <input class="text-input" id="filter-input" style="max-width:320px;margin-bottom:16px;" placeholder="Filter by agent or call ID…">
    <div id="audit-list" style="display:flex;flex-direction:column;gap:12px;"></div>`;
}
function auditRowHTML(a){
  const pct = (a.total/MAX_TOTAL)*100, b = band(pct);
  const initials = a.agentName.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return `
  <div class="card audit-row" data-id="${a.id}">
    <div class="audit-row-top">
      <div class="audit-click">
        <div class="avatar">${initials}</div>
        <div style="min-width:0;">
          <div class="audit-name">${esc(a.agentName)}</div>
          <div class="audit-meta">
            <span>📅 ${esc(a.date)}</span><span>Call ${esc(a.callId)}</span><span>Auditor: ${esc(a.auditorName)}</span>
          </div>
        </div>
      </div>
      ${badgeHTML(b)}
      <div class="stub-divider" style="height:34px;"></div>
      ${ringSVG(pct,44,5,b.color)}
      <button class="icon-btn del-btn" title="Delete" style="margin-left:14px;">🗑️</button>
      <button class="icon-btn toggle-btn">▾</button>
    </div>
    <div class="audit-detail">
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px;">
        ${PARAMETERS.map(p=>`
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
              <span style="color:${COLORS.muted};">${p.label}</span>
              <span class="mono">${a.scores[p.key]}/${p.max}</span>
            </div>
            <div class="param-bar-track"><div class="param-bar-fill" style="width:${(a.scores[p.key]/p.max)*100}%;"></div></div>
          </div>`).join("")}
      </div>
      ${a.remarks ? `<div class="remarks-box"><strong style="font-size:11px;color:${COLORS.muted};text-transform:uppercase;display:block;margin-bottom:4px;">Remarks</strong>${esc(a.remarks)}</div>` : ""}
    </div>
  </div>`;
}
function wireAllAudits(){
  function draw(filterText=""){
    const filtered = audits.filter(a=>a.agentName.toLowerCase().includes(filterText.toLowerCase()) || a.callId.toLowerCase().includes(filterText.toLowerCase()));
    document.getElementById("audit-list").innerHTML = filtered.map(auditRowHTML).join("");
    document.querySelectorAll(".audit-click, .toggle-btn").forEach(el=>{
      el.addEventListener("click", ()=>{
        const row = el.closest(".audit-row");
        row.querySelector(".audit-detail").classList.toggle("open");
        const tbtn = row.querySelector(".toggle-btn");
        tbtn.textContent = row.querySelector(".audit-detail").classList.contains("open") ? "▴" : "▾";
      });
    });
    document.querySelectorAll(".del-btn").forEach(el=>{
      el.addEventListener("click", async (ev)=>{
        ev.stopPropagation();
        const id = el.closest(".audit-row").dataset.id;
        await persistAudits(audits.filter(a=>a.id!==id));
        renderTabContent();
      });
    });
  }
  draw();
  document.getElementById("filter-input").addEventListener("input", e=>draw(e.target.value));
}

/* ---------------- Manage PINs (admin only) ---------------- */
function pinsHTML(){
  const names = agentNames();
  return `
  <div class="grid grid-2">
    <div class="card" style="padding:22px;">
      <div class="section-title">Agent PINs</div>
      ${names.length===0 ? `<div style="color:${COLORS.muted};font-size:13px;">No agents yet. Add an agent's name below, or it will be created automatically the first time you log a call for them.</div>` : ""}
      <div id="pins-list">
        ${names.map(n=>`
          <div class="pin-row">
            <div>
              <div style="font-weight:600;font-size:13.5px;">${esc(n)}</div>
              <div class="mono" style="font-size:13px;color:${COLORS.muted};">PIN: ${esc(agentPins[n] || "— none —")}</div>
            </div>
            <button class="btn-ghost regen-btn" data-name="${esc(n)}">Regenerate</button>
          </div>`).join("")}
      </div>
      <div style="margin-top:18px;display:flex;gap:8px;">
        <input class="text-input" id="new-agent-name" placeholder="Add agent by name">
        <button class="btn-ghost" id="add-agent-btn" style="white-space:nowrap;">Add + Generate PIN</button>
      </div>
    </div>
    <div class="card" style="padding:22px;">
      <div class="section-title">Admin PIN</div>
      <div style="font-size:13px;color:${COLORS.muted};margin-bottom:14px;">This PIN unlocks Overview, New Audit, All Audits, and this page. Keep it to your QA team.</div>
      <label class="field-label">New Admin PIN</label>
      <input class="text-input pin-input" id="new-admin-pin" maxlength="4" inputmode="numeric" placeholder="••••">
      <button class="btn-primary" id="change-admin-pin-btn" style="margin-top:12px;">Update Admin PIN</button>
      <div class="error-text" id="admin-pin-msg"></div>
    </div>
  </div>`;
}
function wirePins(){
  document.querySelectorAll(".regen-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const name = btn.dataset.name;
      const pin = genPin();
      await persistAgentPins({...agentPins, [name]: pin});
      renderTabContent();
    });
  });
  document.getElementById("add-agent-btn").addEventListener("click", async ()=>{
    const nameInput = document.getElementById("new-agent-name");
    const name = nameInput.value.trim();
    if(!name) return;
    if(!agentPins[name]) await persistAgentPins({...agentPins, [name]: genPin()});
    renderTabContent();
  });
  document.getElementById("change-admin-pin-btn").addEventListener("click", async ()=>{
    const v = document.getElementById("new-admin-pin").value.trim();
    const msg = document.getElementById("admin-pin-msg");
    if(!/^\d{4}$/.test(v)){ msg.textContent = "PIN must be 4 digits."; return; }
    await persistAdminPin(v);
    msg.style.color = COLORS.teal;
    msg.textContent = "Admin PIN updated.";
  });
}

/* ---------------- Agent View ---------------- */
function renderAgentContent(){
  const list = audits.filter(a=>a.agentName===currentAgentName).sort((a,b)=>a.createdAt-b.createdAt);
  const el = document.getElementById("agent-content");
  if(list.length===0){ el.innerHTML = `<div class="card empty">No calls audited for you yet — check back after your next audit.</div>`; return; }
  const avgPct = (list.reduce((s,a)=>s+a.total,0)/list.length/MAX_TOTAL)*100;
  const b = band(avgPct);
  const latestPct = (list[list.length-1].total/MAX_TOTAL)*100;

  el.innerHTML = `
    <div class="grid grid-stats" style="margin-bottom:20px;">
      ${statCard("📞","Calls Audited",list.length)}
      ${statCard("📈","Average Score",avgPct.toFixed(1)+"%",b.color)}
      ${statCard("📋","Latest Call",latestPct.toFixed(0)+"%")}
    </div>
    <div class="grid grid-2" style="margin-bottom:20px;">
      <div class="card" style="padding:20px;"><div class="section-title">Score Trend</div><canvas id="chart-trend" height="220"></canvas></div>
      <div class="card" style="padding:20px;"><div class="section-title">Strengths & Gaps</div><canvas id="chart-radar" height="220"></canvas></div>
    </div>
    <div class="section-title">Call History</div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      ${[...list].reverse().map(a=>{
        const pct=(a.total/MAX_TOTAL)*100, cb=band(pct);
        return `<div class="card agent-history-card">
          <div style="flex:1;">
            <div style="font-weight:600;font-size:14px;">Call ${esc(a.callId)}</div>
            <div style="font-size:12px;color:${COLORS.muted};margin-top:2px;">${esc(a.date)} · Audited by ${esc(a.auditorName)}</div>
            ${a.remarks?`<div style="font-size:12.5px;margin-top:6px;">${esc(a.remarks)}</div>`:""}
          </div>
          ${badgeHTML(cb)}
          <div class="stub-divider" style="height:34px;"></div>
          ${ringSVG(pct,44,5,cb.color)}
        </div>`;
      }).join("")}
    </div>`;

  charts.trend = new Chart(document.getElementById("chart-trend"), {
    type:"line",
    data:{ labels: list.map((a,i)=>"#"+(i+1)), datasets:[{ data: list.map(a=>Number(((a.total/MAX_TOTAL)*100).toFixed(1))), borderColor:COLORS.indigo, backgroundColor:COLORS.indigo, tension:.35, pointRadius:4 }] },
    options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.y+"%"}}}, scales:{ y:{min:0,max:100,grid:{color:COLORS.line}}, x:{grid:{display:false}} } }
  });
  const paramAvg = PARAMETERS.map(p=>({
    label: p.label.split(" / ")[0].split(" & ")[0],
    value: Number(((list.reduce((s,a)=>s+a.scores[p.key],0)/list.length/p.max)*100).toFixed(1))
  }));
  charts.radar = new Chart(document.getElementById("chart-radar"), {
    type:"radar",
    data:{ labels: paramAvg.map(p=>p.label), datasets:[{ data: paramAvg.map(p=>p.value), borderColor:b.color, backgroundColor:b.color+"55", pointBackgroundColor:b.color }] },
    options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.r+"%"}}}, scales:{ r:{ min:0,max:100, ticks:{display:false}, grid:{color:COLORS.line}, angleLines:{color:COLORS.line}, pointLabels:{font:{size:10}, color:COLORS.muted} } } }
  });
}

/* ---------------- Init ---------------- */
(async function init(){
  document.getElementById("app").innerHTML = `<div style="padding:60px;text-align:center;color:${COLORS.muted};">Loading…</div>`;
  await loadAll();
  renderApp();
})();
</script>
</body>
</html>
